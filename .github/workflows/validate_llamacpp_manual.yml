name: Validate llama.cpp Manually

on:
  workflow_dispatch:
    inputs:
      lite:
        description: 'Run only the K2-Horizon 0.9B smoke model'
        type: boolean
        default: false
      models:
        description: 'Additional comma-separated IDs; empty uses hot models + K2 0.9B'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Run manual validation
    permissions:
      checks: write
      contents: read
    uses: ./.github/workflows/validate_llamacpp_core.yml
    with:
      lite: ${{ inputs.lite }}
      models: ${{ inputs.models }}
