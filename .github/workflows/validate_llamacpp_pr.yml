name: Validate llama.cpp protected change

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, closed]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  DEPENDABOT_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333 && github.event.pull_request.user.type == 'Bot' }}

concurrency:
  group: ${{ github.event_name == 'merge_group' && format('{0}-merge-group-{1}-{2}-{3}', github.workflow, github.event.merge_group.head_sha, github.run_number, github.run_attempt) || ((github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' || github.event.action == 'edited' || github.event.action == 'labeled' || github.event.action == 'unlabeled' || github.event.action == 'closed') && format('{0}-pr-{1}-event-{2}-{3}', github.workflow, github.event.pull_request.number, github.run_number, github.run_attempt) || format('{0}-unsupported-{1}-{2}', github.workflow, github.run_number, github.run_attempt)) }}
  cancel-in-progress: false

jobs:
  policy:
    name: Resolve protected validation policy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorization_actor: ${{ steps.decision.outputs.authorization_actor }}
      authorization_actor_id: ${{ steps.decision.outputs.authorization_actor_id }}
      authorization_boundary: ${{ steps.decision.outputs.authorization_boundary }}
      authorization_created_at: ${{ steps.decision.outputs.authorization_created_at }}
      authorization_event_id: ${{ steps.decision.outputs.authorization_event_id }}
      base_ref: ${{ steps.identity.outputs.base_ref }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      conclusion: ${{ steps.decision.outputs.conclusion }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      merge_sha: ${{ steps.identity.outputs.merge_sha }}
      observed_merge_sha: ${{ steps.identity.outputs.observed_merge_sha }}
      secondary_observed_merge_sha: ${{ steps.identity.outputs.secondary_observed_merge_sha }}
      mode: ${{ steps.decision.outputs.mode }}
      run_validation: ${{ steps.decision.outputs.run_validation }}
      summary: ${{ steps.decision.outputs.summary }}
    steps:
      - name: Resolve the live candidate identity
        id: identity
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          oid_pattern='^[0-9a-fA-F]{40}$'

          if [ "$EVENT_NAME" = "merge_group" ]; then
            if ! [[ "$MERGE_GROUP_BASE_SHA" =~ $oid_pattern && "$MERGE_GROUP_HEAD_SHA" =~ $oid_pattern ]]; then
              echo "::error::Merge-group commits must be full Git OIDs."
              exit 1
            fi
            {
              echo "base_sha=$MERGE_GROUP_BASE_SHA"
              echo "base_ref="
              echo "head_sha=$MERGE_GROUP_HEAD_SHA"
              echo "merge_sha=$MERGE_GROUP_HEAD_SHA"
              echo "observed_merge_sha="
              echo "secondary_observed_merge_sha="
              echo "merge_candidate_available=true"
              echo "state=open"
              echo "merged=false"
              echo "changed_files=0"
              echo "authorization_label_present=false"
              echo "identity_matches=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" != "pull_request_target" ] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Unsupported protected-validation invocation."
            exit 1
          fi

          pull_request=""
          for attempt in 1 2 3; do
            pull_request=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            snapshot_state=$(jq -r '.state // empty' <<<"$pull_request")
            snapshot_merged=$(jq -r '.merged | tostring' <<<"$pull_request")
            snapshot_mergeable=$(jq -r \
              '.mergeable | if . == null then "null" else tostring end' \
              <<<"$pull_request")
            if [ "$snapshot_state" != "open" ] || [ "$snapshot_merged" = "true" ] || \
               [ "$snapshot_mergeable" = "true" ] || [ "$snapshot_mergeable" = "false" ] || \
               [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep 2
          done
          current_number=$(jq -er '.number' <<<"$pull_request")
          current_state=$(jq -er '.state' <<<"$pull_request")
          current_merged=$(jq -er \
            '.merged | if type == "boolean" then tostring else error("invalid merged state") end' \
            <<<"$pull_request")
          current_base=$(jq -er '.base.sha' <<<"$pull_request")
          current_base_ref=$(jq -er \
            '.base.ref | select(type == "string" and test("^[0-9A-Za-z._/-]+$"))' \
            <<<"$pull_request")
          current_head=$(jq -er '.head.sha' <<<"$pull_request")
          current_merge=$(jq -r '.merge_commit_sha // empty' <<<"$pull_request")
          current_mergeable=$(jq -r \
            '.mergeable | if . == null then "null" else tostring end' \
            <<<"$pull_request")
          current_changed_files=$(jq -er '.changed_files' <<<"$pull_request")
          current_authorized=$(jq -r \
            'any(.labels[]?; .name == "ci:upgrades")' <<<"$pull_request")

          if [ "$current_number" != "$PR_NUMBER" ] || \
             ! [[ "$current_state" =~ ^(open|closed)$ ]] || \
             ! [[ "$current_merged" =~ ^(true|false)$ ]] || \
             ! [[ "$current_mergeable" =~ ^(true|false|null)$ ]] || \
             ! [[ "$current_changed_files" =~ ^[0-9]+$ ]] || \
             ! [[ "$current_base" =~ $oid_pattern && "$current_head" =~ $oid_pattern ]] || \
             ! git check-ref-format "refs/heads/${current_base_ref}" >/dev/null || \
             { [ -n "$current_merge" ] && ! [[ "$current_merge" =~ $oid_pattern ]]; }; then
            echo "::error::The live pull request returned an invalid identity."
            exit 1
          fi
          if [ "$current_merged" = "true" ] && [ "$current_state" != "closed" ]; then
            echo "::error::The live pull request returned an inconsistent lifecycle state."
            exit 1
          fi

          candidate_sha="$current_head"
          merge_candidate_available=false
          observed_merge_sha=""
          secondary_observed_merge_sha=""
          if [ "$current_mergeable" = "true" ] && [[ "$current_merge" =~ $oid_pattern ]]; then
            candidate_sha="$current_merge"
            merge_candidate_available=true
          elif [[ "$current_merge" =~ $oid_pattern ]]; then
            observed_merge_sha="$current_merge"
          fi
          if [ "$merge_candidate_available" = "false" ] && \
             [[ "$EVENT_MERGE_SHA" =~ $oid_pattern ]] && \
             [ "$EVENT_MERGE_SHA" != "$observed_merge_sha" ]; then
            if [ -z "$observed_merge_sha" ]; then
              observed_merge_sha="$EVENT_MERGE_SHA"
            else
              secondary_observed_merge_sha="$EVENT_MERGE_SHA"
            fi
          fi

          merge_identity_matches=true
          if [ "$merge_candidate_available" = "true" ] && \
             [ "$current_merge" != "$EVENT_MERGE_SHA" ]; then
            merge_identity_matches=false
          fi
          identity_matches=false
          if [ "$current_base_ref" = "$EVENT_BASE_REF" ] && \
             [ "$current_base" = "$EVENT_BASE_SHA" ] && \
             [ "$current_head" = "$EVENT_HEAD_SHA" ] && \
             [ "$merge_identity_matches" = "true" ]; then
            identity_matches=true
          fi
          {
            echo "base_ref=$current_base_ref"
            echo "base_sha=$current_base"
            echo "head_sha=$current_head"
            echo "merge_sha=$candidate_sha"
            echo "observed_merge_sha=$observed_merge_sha"
            echo "secondary_observed_merge_sha=$secondary_observed_merge_sha"
            echo "merge_candidate_available=$merge_candidate_available"
            echo "state=$current_state"
            echo "merged=$current_merged"
            echo "changed_files=$current_changed_files"
            echo "authorization_label_present=$current_authorized"
            echo "identity_matches=$identity_matches"
          } >> "$GITHUB_OUTPUT"

      - name: Check out trusted policy code
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.identity.outputs.base_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - name: Classify the complete pull request file set
        id: classify
        if: github.event_name == 'pull_request_target' && steps.identity.outputs.state == 'open'
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          EXPECTED_COUNT: ${{ steps.identity.outputs.changed_files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ steps.identity.outputs.merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          if ! [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull-request file count is invalid."
            exit 1
          fi
          if [ "$EXPECTED_COUNT" -gt 300 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          comparison_path="$RUNNER_TEMP/llamacpp-pr-comparison-${PR_NUMBER}.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${MERGE_SHA}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            > "$comparison_path"
          python trusted/.github/scripts/llamacpp_required_check_policy.py \
            classify-compare \
            --response "$comparison_path" \
            --expected-base-sha "$BASE_SHA" \
            --expected-target-sha "$MERGE_SHA" \
            --expected-count "$EXPECTED_COUNT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Decide whether protected validation may run
        id: decision
        env:
          AUTHORIZATION_LABEL_PRESENT: ${{ steps.identity.outputs.authorization_label_present }}
          BASE_REF_CHANGED: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from != '' }}
          CHECK_NAME: llama.cpp authorized validation v2
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          DEPENDABOT_PR: ${{ env.DEPENDABOT_PR }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY_MATCHES: ${{ steps.identity.outputs.identity_matches }}
          MERGED: ${{ steps.identity.outputs.merged }}
          MERGE_CANDIDATE_AVAILABLE: ${{ steps.identity.outputs.merge_candidate_available }}
          MERGE_SHA: ${{ steps.identity.outputs.merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RELEVANT: ${{ steps.classify.outputs.relevant || 'true' }}
          STATE: ${{ steps.identity.outputs.state }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            {
              echo "authorization_actor="
              echo "authorization_actor_id=0"
              echo "authorization_created_at="
              echo "authorization_event_id=0"
              echo "mode=validate"
              echo "run_validation=true"
              echo "conclusion="
              echo "summary=Merge-queue validation is mandatory."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          authorization_actor=""
          authorization_actor_id=0
          authorization_boundary=""
          authorization_created_at=""
          authorization_epoch_valid=false
          authorization_event_id=0
          authorization_rerun_matches=false
          actor_permission=""
          has_existing_check=false
          has_newer_check=false
          if [ "$MERGED" != "true" ] && [ "$STATE" = "open" ]; then
            if [[ "$CURRENT_RUN_ATTEMPT" =~ ^([2-9]|[1-9][0-9]+)$ ]] && \
               [[ "$CURRENT_RUN_ID" =~ ^[1-9][0-9]*$ ]] && \
               [[ "$CURRENT_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] && \
               { [ "$EVENT_ACTION" = "opened" ] || \
                 [ "$EVENT_ACTION" = "reopened" ] || \
                 [ "$EVENT_ACTION" = "synchronize" ]; }; then
              first_attempt=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CURRENT_RUN_ID}/attempts/1" \
                2>/dev/null || true)
              if jq -e --arg base_ref "$EVENT_BASE_REF" \
                --arg head_sha "$EVENT_HEAD_SHA" \
                --arg path ".github/workflows/validate_llamacpp_pr.yml" \
                --arg repository "$GITHUB_REPOSITORY" \
                --argjson run_id "$CURRENT_RUN_ID" \
                --argjson run_number "$CURRENT_RUN_NUMBER" \
                '.id == $run_id and .run_number == $run_number and
                 .run_attempt == 1 and .event == "pull_request_target" and
                 (.path == $path or .path == ($path + "@" + $base_ref) or
                  .path == ($path + "@refs/heads/" + $base_ref)) and
                 .head_sha == $head_sha and
                 .repository.full_name == $repository and
                 ((.pull_requests | type) == "array") and
                 .status == "completed" and
                 .conclusion == "failure" and
                 (.created_at | type == "string" and length > 0) and
                 (.run_started_at | type == "string" and length > 0)' \
                <<<"$first_attempt" >/dev/null 2>&1; then
                authorization_boundary=$(jq -r '.run_started_at' <<<"$first_attempt")
              fi
            fi
            events_path="$RUNNER_TEMP/llamacpp-pr-events-${PR_NUMBER}.json"
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" > "$events_path"
            provenance_arguments=(provenance --pages "$events_path")
            if [ -n "$authorization_boundary" ]; then
              provenance_arguments+=(--authorization-after "$authorization_boundary")
            fi
            provenance=$(python \
              trusted/.github/scripts/llamacpp_required_check_policy.py \
              "${provenance_arguments[@]}")
            authorization_actor=$(jq -er '.authorization_actor' <<<"$provenance")
            authorization_actor_id=$(jq -er '.authorization_actor_id' <<<"$provenance")
            authorization_created_at=$(jq -er '.authorization_created_at' <<<"$provenance")
            authorization_epoch_valid=$(jq -er \
              '.epoch_valid | if type == "boolean" then tostring else error("invalid epoch") end' \
              <<<"$provenance")
            authorization_event_id=$(jq -er '.authorization_event_id' <<<"$provenance")
            if [ -n "$authorization_actor" ]; then
              permission_response=$(gh api \
                "repos/${GITHUB_REPOSITORY}/collaborators/${authorization_actor}/permission" \
                2>/dev/null || true)
              if jq -e --argjson actor_id "$authorization_actor_id" \
                '.user.id == $actor_id and (.permission | type == "string")' \
                <<<"$permission_response" >/dev/null 2>&1; then
                actor_permission=$(jq -r '.permission' <<<"$permission_response")
              fi
            fi
            if [ -n "$authorization_boundary" ] && \
               [ "$TRIGGERING_ACTOR" = "$authorization_actor" ]; then
              authorization_rerun_matches=true
            fi

            if [ "$DEPENDABOT_PR" != "true" ]; then
              external_prefix="lemonade-llamacpp-required-pr-${PR_NUMBER}-"
              check_runs=$(gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f check_name="$CHECK_NAME" -f filter=all -F per_page=100)
              IFS=$'\t' read -r newest_check_epoch newest_check_number \
                newest_check_attempt newest_check_status newest_check_conclusion < <(
                jq -r --arg check_name "$CHECK_NAME" \
                  --arg external_prefix "$external_prefix" \
                  '[.[] | .check_runs[]?
                    | select(.name == $check_name and .app.slug == "github-actions")
                    | select((.external_id // "") | startswith($external_prefix))
                    | . as $check
                    | try ((.external_id | ltrimstr($external_prefix)
                        | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                        | {epoch: (.epoch | tonumber), number: (.number | tonumber),
                           attempt: (.attempt | tonumber),
                           status: ($check.status // ""),
                           conclusion: ($check.conclusion // "")}) catch empty]
                   | sort_by(.number, .attempt)
                   | (last // {epoch: 0, number: 0, attempt: 0,
                       status: "", conclusion: ""})
                   | [.epoch, .number, .attempt, .status, .conclusion]
                   | @tsv' <<<"$check_runs"
              )
              if [ "$newest_check_epoch" = "$authorization_event_id" ] && \
                 [ "$newest_check_status" = "completed" ] && \
                 [ "$newest_check_conclusion" = "success" ]; then
                has_existing_check=true
              fi
              if [ "$newest_check_number" -gt "$CURRENT_RUN_NUMBER" ] || \
                 { [ "$newest_check_number" -eq "$CURRENT_RUN_NUMBER" ] && \
                   [ "$newest_check_attempt" -gt "$CURRENT_RUN_ATTEMPT" ]; }; then
                has_newer_check=true
              fi
            fi
          fi

          python trusted/.github/scripts/llamacpp_required_check_policy.py decide \
            --action "$EVENT_ACTION" --event-label "$EVENT_LABEL" \
            --base-ref-changed "$BASE_REF_CHANGED" --state "$STATE" \
            --merged "$MERGED" \
            --merge-candidate-available "$MERGE_CANDIDATE_AVAILABLE" \
            --relevant "$RELEVANT" \
            --identity-matches "$IDENTITY_MATCHES" \
            --authorization-label-present "$AUTHORIZATION_LABEL_PRESENT" \
            --authorization-epoch-valid "$authorization_epoch_valid" \
            --authorization-rerun-matches "$authorization_rerun_matches" \
            --actor-permission "$actor_permission" \
            --has-existing-check "$has_existing_check" \
            --has-newer-check "$has_newer_check" \
            --required-workflow-only "$DEPENDABOT_PR" \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "authorization_actor=$authorization_actor"
            echo "authorization_actor_id=$authorization_actor_id"
            echo "authorization_boundary=$authorization_boundary"
            echo "authorization_created_at=$authorization_created_at"
            echo "authorization_event_id=$authorization_event_id"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Run authorized validation
    needs: policy
    if: needs.policy.result == 'success' && needs.policy.outputs.run_validation == 'true'
    permissions:
      checks: write
      contents: read
    uses: ./.github/workflows/validate_llamacpp_core.yml
    with:
      authorization_epoch: ${{ needs.policy.outputs.authorization_event_id }}

  reconcile:
    name: Reconcile required validation check
    needs: [policy, validate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted reconciliation policy code
        if: >-
          needs.policy.result == 'success' &&
          (needs.policy.outputs.mode == 'validate' ||
           needs.policy.outputs.mode == 'preserve')
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.policy.outputs.base_sha }}
          path: trusted-reconcile
          persist-credentials: false
          fetch-depth: 1

      - name: Assess policy and validation
        id: assess-policy
        if: always()
        env:
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ needs.policy.outputs.mode }}
          POLICY_CONCLUSION: ${{ needs.policy.outputs.conclusion }}
          POLICY_RESULT: ${{ needs.policy.result }}
          POLICY_SUMMARY: ${{ needs.policy.outputs.summary }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          mode="${MODE:-policy_error}"
          conclusion="${POLICY_CONCLUSION:-failure}"
          summary="${POLICY_SUMMARY:-Protected validation policy resolution failed.}"
          passed=false
          fallback_base_ref=""
          fallback_base_sha=""
          fallback_head_sha=""
          fallback_merge_sha=""
          fallback_observed_merge_sha=""
          fallback_secondary_observed_merge_sha=""

          if [ "$POLICY_RESULT" != "success" ]; then
            live_closed=false
            live_identity_valid=false
            if [[ "${PR_NUMBER:-}" =~ ^[0-9]+$ ]]; then
              pull_request=$(gh api \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null || true)
              if jq -e --argjson number "$PR_NUMBER" \
                '.number == $number and (.state == "open" or .state == "closed") and
                 (.merged | type == "boolean") and (.base.ref | type == "string") and
                 (.base.sha | type == "string") and (.head.sha | type == "string") and
                 ((.mergeable == null) or (.mergeable | type == "boolean")) and
                 ((.merge_commit_sha == null) or (.merge_commit_sha | type == "string"))' \
                <<<"$pull_request" >/dev/null 2>&1; then
                current_state=$(jq -r '.state' <<<"$pull_request")
                current_merged=$(jq -r '.merged' <<<"$pull_request")
                current_base_ref=$(jq -r '.base.ref' <<<"$pull_request")
                current_base=$(jq -r '.base.sha' <<<"$pull_request")
                current_head=$(jq -r '.head.sha' <<<"$pull_request")
                current_merge=$(jq -r '.merge_commit_sha // empty' <<<"$pull_request")
                current_mergeable=$(jq -r \
                  '.mergeable | if . == null then "null" else tostring end' \
                  <<<"$pull_request")
                if git check-ref-format "refs/heads/${current_base_ref}" >/dev/null && \
                   [[ "$current_base" =~ ^[0-9a-fA-F]{40}$ ]] && \
                   [[ "$current_head" =~ ^[0-9a-fA-F]{40}$ ]] && \
                   { [ -z "$current_merge" ] || \
                     [[ "$current_merge" =~ ^[0-9a-fA-F]{40}$ ]]; } && \
                   { [ "$current_merged" = "false" ] || \
                     [ "$current_state" = "closed" ]; }; then
                  live_identity_valid=true
                  if [ "$current_state" = "closed" ]; then
                    live_closed=true
                  else
                    fallback_base_ref="$current_base_ref"
                    fallback_base_sha="$current_base"
                    fallback_head_sha="$current_head"
                    fallback_merge_sha="$current_head"
                    if [ "$current_mergeable" = "true" ] && \
                       [[ "$current_merge" =~ ^[0-9a-fA-F]{40}$ ]]; then
                      fallback_merge_sha="$current_merge"
                    elif [[ "$current_merge" =~ ^[0-9a-fA-F]{40}$ ]]; then
                      fallback_observed_merge_sha="$current_merge"
                    fi
                    if [ "$current_mergeable" != "true" ] && \
                       [[ "$EVENT_MERGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && \
                       [ "$EVENT_MERGE_SHA" != "$fallback_observed_merge_sha" ]; then
                      if [ -z "$fallback_observed_merge_sha" ]; then
                        fallback_observed_merge_sha="$EVENT_MERGE_SHA"
                      else
                        fallback_secondary_observed_merge_sha="$EVENT_MERGE_SHA"
                      fi
                    fi
                  fi
                fi
              fi
            fi
            if [ "$live_identity_valid" = "false" ] && \
               [[ "${EVENT_BASE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] && \
               [[ "${EVENT_HEAD_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]] && \
               git check-ref-format "refs/heads/${EVENT_BASE_REF:-}" >/dev/null; then
              fallback_base_ref="$EVENT_BASE_REF"
              fallback_base_sha="$EVENT_BASE_SHA"
              fallback_head_sha="$EVENT_HEAD_SHA"
              fallback_merge_sha="$EVENT_HEAD_SHA"
              if [[ "${EVENT_MERGE_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
                fallback_observed_merge_sha="$EVENT_MERGE_SHA"
              fi
            fi
            if [ "$live_closed" = "true" ]; then
              mode=skip_closed
              conclusion=""
              summary="The pull request is still closed; no commit check was changed."
              passed=true
            else
              mode=policy_error
              conclusion=failure
              summary="Protected validation policy resolution failed closed."
            fi
          else
            case "$mode" in
              validate)
                if [ "$VALIDATION_RESULT" = "success" ]; then
                  conclusion=success
                  summary="All authorized llama.cpp validation jobs passed."
                  passed=true
                else
                  conclusion=failure
                  summary="Authorized validation result: $VALIDATION_RESULT."
                fi
                ;;
              neutral)
                [ "$conclusion" = "success" ] && passed=true
                ;;
              awaiting_rerun)
                conclusion=failure
                ;;
              superseded)
                conclusion=failure
                ;;
              stale_required)
                conclusion=failure
                ;;
              preserve|stale|merged|closed)
                passed=true
                ;;
              *)
                conclusion=failure
                ;;
            esac
          fi
          {
            echo "mode=$mode"
            echo "conclusion=$conclusion"
            echo "summary=$summary"
            echo "passed=$passed"
            echo "fallback_base_ref=$fallback_base_ref"
            echo "fallback_base_sha=$fallback_base_sha"
            echo "fallback_head_sha=$fallback_head_sha"
            echo "fallback_merge_sha=$fallback_merge_sha"
            echo "fallback_observed_merge_sha=$fallback_observed_merge_sha"
            echo "fallback_secondary_observed_merge_sha=$fallback_secondary_observed_merge_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve the exact-commit gate for unrelated metadata
        id: preserve-gate
        if: needs.policy.outputs.mode == 'preserve' && env.DEPENDABOT_PR != 'true'
        env:
          AUTHORIZATION_ACTOR: ${{ needs.policy.outputs.authorization_actor }}
          AUTHORIZATION_ACTOR_ID: ${{ needs.policy.outputs.authorization_actor_id }}
          AUTHORIZATION_CREATED_AT: ${{ needs.policy.outputs.authorization_created_at }}
          AUTHORIZATION_EPOCH: ${{ needs.policy.outputs.authorization_event_id }}
          BASE_REF: ${{ needs.policy.outputs.base_ref }}
          BASE_SHA: ${{ needs.policy.outputs.base_sha }}
          CHECK_NAME: llama.cpp authorized validation v2
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.policy.outputs.head_sha }}
          MERGE_SHA: ${{ needs.policy.outputs.merge_sha }}
          POLICY_HELPER: trusted-reconcile/.github/scripts/llamacpp_required_check_policy.py
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          preserve_valid=false
          external_prefix="lemonade-llamacpp-required-pr-${PR_NUMBER}-"
          pull_request=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" 2>/dev/null || true)
          if jq -e --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .merged == false and
             (.base.ref | type == "string") and (.base.sha | type == "string") and
             (.head.sha | type == "string") and
             ((.mergeable == null) or (.mergeable | type == "boolean")) and
             ((.merge_commit_sha == null) or (.merge_commit_sha | type == "string")) and
             any(.labels[]?; .name == "ci:upgrades")' \
            <<<"$pull_request" >/dev/null 2>&1; then
            current_base_ref=$(jq -r '.base.ref' <<<"$pull_request")
            current_base=$(jq -r '.base.sha' <<<"$pull_request")
            current_head=$(jq -r '.head.sha' <<<"$pull_request")
            current_merge=$(jq -r '.merge_commit_sha // empty' <<<"$pull_request")
            current_mergeable=$(jq -r \
              '.mergeable | if . == null then "null" else tostring end' \
              <<<"$pull_request")
            current_candidate="$current_head"
            if [ "$current_mergeable" = "true" ] && \
               [[ "$current_merge" =~ ^[0-9a-fA-F]{40}$ ]]; then
              current_candidate="$current_merge"
            fi
            if git check-ref-format "refs/heads/${current_base_ref}" >/dev/null && \
               [[ "$current_base" =~ ^[0-9a-fA-F]{40}$ ]] && \
               [[ "$current_head" =~ ^[0-9a-fA-F]{40}$ ]] && \
               { [ -z "$current_merge" ] || \
                 [[ "$current_merge" =~ ^[0-9a-fA-F]{40}$ ]]; } && \
               [ "$current_base_ref" = "$BASE_REF" ] && \
               [ "$current_base" = "$BASE_SHA" ] && \
               [ "$current_head" = "$HEAD_SHA" ] && \
               [ "$current_candidate" = "$MERGE_SHA" ] && \
               [[ "$AUTHORIZATION_EPOCH" =~ ^[1-9][0-9]*$ ]] && \
               [[ "$AUTHORIZATION_ACTOR_ID" =~ ^[1-9][0-9]*$ ]] && \
               [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] && \
               [[ "$RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] && \
               [ -f "$POLICY_HELPER" ]; then
              events_path=$(mktemp "${RUNNER_TEMP}/llamacpp-preserve-events.XXXXXX")
              if gh api --method GET --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" > "$events_path"; then
                provenance=$(python "$POLICY_HELPER" provenance \
                  --pages "$events_path" 2>/dev/null || true)
                if jq -e --arg actor "$AUTHORIZATION_ACTOR" \
                  --arg created_at "$AUTHORIZATION_CREATED_AT" \
                  --argjson actor_id "$AUTHORIZATION_ACTOR_ID" \
                  --argjson epoch "$AUTHORIZATION_EPOCH" \
                  '.authorization_actor == $actor and
                   .authorization_actor_id == $actor_id and
                   .authorization_created_at == $created_at and
                   .authorization_event_id == $epoch and
                   .authorization_event == "labeled" and .epoch_valid == true' \
                  <<<"$provenance" >/dev/null 2>&1; then
                  permission_response=$(gh api \
                    "repos/${GITHUB_REPOSITORY}/collaborators/${AUTHORIZATION_ACTOR}/permission" \
                    2>/dev/null || true)
                  if jq -e --argjson actor_id "$AUTHORIZATION_ACTOR_ID" \
                    '.user.id == $actor_id and
                     (.permission == "admin" or .permission == "maintain" or
                      .permission == "push" or .permission == "write")' \
                    <<<"$permission_response" >/dev/null 2>&1; then
                    check_runs=$(gh api --method GET --paginate --slurp \
                      "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      -f check_name="$CHECK_NAME" -f filter=all -F per_page=100 \
                      2>/dev/null || true)
                    IFS=$'\t' read -r newest_check_epoch newest_check_number \
                      newest_check_attempt newest_check_status \
                      newest_check_conclusion < <(
                      jq -r --arg check_name "$CHECK_NAME" \
                        --arg external_prefix "$external_prefix" \
                        '[.[] | .check_runs[]?
                          | select(.name == $check_name and
                              .app.slug == "github-actions")
                          | select((.external_id // "") |
                              startswith($external_prefix))
                          | . as $check
                          | try ((.external_id | ltrimstr($external_prefix)
                              | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                              | {epoch: (.epoch | tonumber),
                                 number: (.number | tonumber),
                                 attempt: (.attempt | tonumber),
                                 status: ($check.status // ""),
                                 conclusion: ($check.conclusion // "")}) catch empty]
                         | sort_by(.number, .attempt)
                         | (last // {epoch: 0, number: 0, attempt: 0,
                             status: "", conclusion: ""})
                         | [.epoch, .number, .attempt, .status, .conclusion]
                         | @tsv' <<<"$check_runs"
                    )
                    if [ "$newest_check_epoch" = "$AUTHORIZATION_EPOCH" ] && \
                       [ "$newest_check_status" = "completed" ] && \
                       [ "$newest_check_conclusion" = "success" ] && \
                       { [ "$newest_check_number" -lt "$RUN_NUMBER" ] || \
                         { [ "$newest_check_number" -eq "$RUN_NUMBER" ] && \
                           [ "$newest_check_attempt" -le "$RUN_ATTEMPT" ]; }; }; then
                      preserve_valid=true
                    fi
                  fi
                fi
              fi
              rm -f "$events_path"
            fi
          fi
          echo "valid=$preserve_valid" >> "$GITHUB_OUTPUT"
          if [ "$preserve_valid" != "true" ]; then
            echo "::error::The live authorization epoch cannot preserve this exact-commit gate."
          fi

      - name: Revalidate an authorized Dependabot result
        if: >-
          always() &&
          env.DEPENDABOT_PR == 'true' &&
          steps.assess-policy.outputs.mode == 'validate' &&
          steps.assess-policy.outputs.conclusion == 'success'
        env:
          AUTHORIZATION_ACTOR: ${{ needs.policy.outputs.authorization_actor }}
          AUTHORIZATION_ACTOR_ID: ${{ needs.policy.outputs.authorization_actor_id }}
          AUTHORIZATION_BOUNDARY: ${{ needs.policy.outputs.authorization_boundary }}
          AUTHORIZATION_CREATED_AT: ${{ needs.policy.outputs.authorization_created_at }}
          AUTHORIZATION_EPOCH: ${{ needs.policy.outputs.authorization_event_id }}
          BASE_REF: ${{ needs.policy.outputs.base_ref }}
          BASE_SHA: ${{ needs.policy.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.policy.outputs.head_sha }}
          MERGE_SHA: ${{ needs.policy.outputs.merge_sha }}
          POLICY_HELPER: trusted-reconcile/.github/scripts/llamacpp_required_check_policy.py
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          oid_pattern='^[0-9a-fA-F]{40}$'
          pull_request=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          if ! jq -e --argjson number "$PR_NUMBER" \
            '.number == $number and .state == "open" and .merged == false and
             (.base.ref | type == "string") and (.base.sha | type == "string") and
             (.head.sha | type == "string") and
             ((.mergeable == null) or (.mergeable | type == "boolean")) and
             ((.merge_commit_sha == null) or (.merge_commit_sha | type == "string"))' \
            <<<"$pull_request" >/dev/null; then
            echo "::error::The live Dependabot pull request identity is invalid."
            exit 1
          fi
          current_base_ref=$(jq -r '.base.ref' <<<"$pull_request")
          current_base=$(jq -r '.base.sha' <<<"$pull_request")
          current_head=$(jq -r '.head.sha' <<<"$pull_request")
          current_merge=$(jq -r '.merge_commit_sha // empty' <<<"$pull_request")
          current_mergeable=$(jq -r \
            '.mergeable | if . == null then "null" else tostring end' \
            <<<"$pull_request")
          if ! git check-ref-format "refs/heads/${current_base_ref}" >/dev/null || \
             ! [[ "$current_base" =~ $oid_pattern && "$current_head" =~ $oid_pattern ]] || \
             { [ -n "$current_merge" ] && ! [[ "$current_merge" =~ $oid_pattern ]]; }; then
            echo "::error::The live Dependabot pull request identity is invalid."
            exit 1
          fi
          current_candidate="$current_head"
          if [ "$current_mergeable" = "true" ] && \
             [[ "$current_merge" =~ $oid_pattern ]]; then
            current_candidate="$current_merge"
          fi
          if [ "$current_base_ref" != "$BASE_REF" ] || \
             [ "$current_base" != "$BASE_SHA" ] || \
             [ "$current_head" != "$HEAD_SHA" ] || \
             [ "$current_candidate" != "$MERGE_SHA" ]; then
            echo "::error::The Dependabot candidate changed during validation."
            exit 1
          fi
          current_authorized=$(jq -r \
            'any(.labels[]?; .name == "ci:upgrades")' <<<"$pull_request")
          if [ "$current_authorized" != "true" ] || \
             ! [[ "$AUTHORIZATION_EPOCH" =~ ^[1-9][0-9]*$ ]] || \
             ! [[ "$AUTHORIZATION_ACTOR_ID" =~ ^[1-9][0-9]*$ ]] || \
             [ -z "$AUTHORIZATION_BOUNDARY" ] || [ ! -f "$POLICY_HELPER" ]; then
            echo "::error::The Dependabot authorization is no longer live."
            exit 1
          fi

          events_path=$(mktemp "${RUNNER_TEMP:-/tmp}/llamacpp-dependabot-events.XXXXXX")
          trap 'rm -f "$events_path"' EXIT
          gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" > "$events_path"
          provenance=$(python "$POLICY_HELPER" provenance --pages "$events_path" \
            --authorization-after "$AUTHORIZATION_BOUNDARY")
          authorization_actor=$(jq -er '.authorization_actor' <<<"$provenance")
          authorization_actor_id=$(jq -er '.authorization_actor_id' <<<"$provenance")
          authorization_created_at=$(jq -er '.authorization_created_at' <<<"$provenance")
          authorization_event_id=$(jq -er '.authorization_event_id' <<<"$provenance")
          authorization_event=$(jq -er '.authorization_event' <<<"$provenance")
          authorization_epoch_valid=$(jq -er \
            '.epoch_valid | if type == "boolean" then tostring else error("invalid epoch") end' \
            <<<"$provenance")
          if [ "$authorization_actor" != "$AUTHORIZATION_ACTOR" ] || \
             [ "$authorization_actor_id" != "$AUTHORIZATION_ACTOR_ID" ] || \
             [ "$authorization_created_at" != "$AUTHORIZATION_CREATED_AT" ] || \
             [ "$authorization_event_id" != "$AUTHORIZATION_EPOCH" ] || \
             [ "$authorization_event" != "labeled" ] || \
             [ "$authorization_epoch_valid" != "true" ]; then
            echo "::error::The Dependabot authorization epoch changed during validation."
            exit 1
          fi
          permission_response=$(gh api \
            "repos/${GITHUB_REPOSITORY}/collaborators/${authorization_actor}/permission")
          if ! jq -e --argjson actor_id "$authorization_actor_id" \
            '.user.id == $actor_id and
             (.permission == "admin" or .permission == "maintain" or
              .permission == "push" or .permission == "write")' \
            <<<"$permission_response" >/dev/null; then
            echo "::error::The Dependabot authorization actor lost write permission."
            exit 1
          fi

      - name: Invalidate an unconfirmed observed merge commit
        if: >-
          always() &&
          env.DEPENDABOT_PR != 'true' &&
          (needs.policy.outputs.observed_merge_sha != '' ||
           needs.policy.outputs.secondary_observed_merge_sha != '' ||
           steps.assess-policy.outputs.fallback_observed_merge_sha != '' ||
           steps.assess-policy.outputs.fallback_secondary_observed_merge_sha != '') &&
          steps.assess-policy.outputs.mode != 'preserve' &&
          steps.assess-policy.outputs.mode != 'awaiting_rerun' &&
          steps.assess-policy.outputs.mode != 'superseded' &&
          steps.assess-policy.outputs.mode != 'stale_required' &&
          steps.assess-policy.outputs.mode != 'stale' &&
          steps.assess-policy.outputs.mode != 'merged' &&
          steps.assess-policy.outputs.mode != 'skip_closed'
        env:
          AUTHORIZATION_EPOCH: ${{ needs.policy.outputs.authorization_event_id || 0 }}
          CHECK_NAME: llama.cpp authorization diagnostics v2
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OBSERVED_MERGE_SHA: ${{ steps.assess-policy.outputs.fallback_observed_merge_sha || needs.policy.outputs.observed_merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SECONDARY_OBSERVED_MERGE_SHA: ${{ steps.assess-policy.outputs.fallback_secondary_observed_merge_sha || needs.policy.outputs.secondary_observed_merge_sha }}
        run: |
          set -euo pipefail
          external_prefix="lemonade-llamacpp-metadata-pr-${PR_NUMBER}-"
          if ! [[ "$AUTHORIZATION_EPOCH" =~ ^[0-9]+$ ]]; then
            AUTHORIZATION_EPOCH=0
          fi

          invalidate_observed_merge() {
            local observed_merge_sha="$1"
            local check_runs check_run_id newest_number newest_attempt prior_check_ids
            local external_id summary
            if ! [[ "$observed_merge_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::The observed merge commit must be a full Git OID."
              return 1
            fi

            external_id="${external_prefix}${AUTHORIZATION_EPOCH}-${RUN_NUMBER}-${RUN_ATTEMPT}-${RUN_ID}"
            check_runs=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${observed_merge_sha}/check-runs" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f check_name="$CHECK_NAME" -f filter=all -F per_page=100)
            IFS=$'\t' read -r newest_number newest_attempt < <(
              jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$external_prefix" \
                '[.[] | .check_runs[]?
                  | select(.name == $check_name and .app.slug == "github-actions")
                  | select((.external_id // "") | startswith($external_prefix))
                  | try ((.external_id | ltrimstr($external_prefix)
                      | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                      | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty]
                 | sort_by(.number, .attempt)
                 | (last // {number: 0, attempt: 0})
                 | [.number, .attempt] | @tsv' <<<"$check_runs"
            )
            if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
               { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
                 [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
              echo "::notice::A newer policy run already invalidated ${observed_merge_sha}."
              return 0
            fi

            check_run_id=$(jq -r --arg check_name "$CHECK_NAME" \
              --arg external_id "$external_id" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions" and
                    .external_id == $external_id)
                | .id] | last // empty' <<<"$check_runs")
            summary="GitHub did not confirm this observed synthetic merge commit as executable."
            if [[ "$check_run_id" =~ ^[0-9]+$ ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f name="$CHECK_NAME" -f status=completed -f conclusion=failure \
                -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                -f "output[title]=$CHECK_NAME" -f "output[summary]=$summary" >/dev/null
            else
              response=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f name="$CHECK_NAME" -f head_sha="$observed_merge_sha" \
                -f external_id="$external_id" -f status=completed -f conclusion=failure \
                -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                -f "output[title]=$CHECK_NAME" -f "output[summary]=$summary")
              check_run_id=$(jq -r '.id // empty' <<<"$response")
            fi
            if ! [[ "$check_run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Checks API returned an invalid observed-merge check-run ID."
              return 1
            fi

            check_runs=$(gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${observed_merge_sha}/check-runs" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f check_name="$CHECK_NAME" -f filter=all -F per_page=100)
            IFS=$'\t' read -r newest_number newest_attempt < <(
              jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$external_prefix" \
                '[.[] | .check_runs[]?
                  | select(.name == $check_name and .app.slug == "github-actions")
                  | select((.external_id // "") | startswith($external_prefix))
                  | try ((.external_id | ltrimstr($external_prefix)
                      | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                      | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty]
                 | sort_by(.number, .attempt)
                 | (last // {number: 0, attempt: 0})
                 | [.number, .attempt] | @tsv' <<<"$check_runs"
            )
            if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
               { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
                 [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f name="$CHECK_NAME" -f status=completed -f conclusion=cancelled \
                -f "output[title]=$CHECK_NAME" \
                -f "output[summary]=Superseded by a newer policy decision." >/dev/null
              return 0
            fi

            prior_check_ids=$(jq -r --arg check_name "$CHECK_NAME" \
              --arg external_prefix "$external_prefix" \
              --argjson current_number "$RUN_NUMBER" --argjson current_attempt "$RUN_ATTEMPT" \
              '.[] | .check_runs[]?
               | select(.name == $check_name and .app.slug == "github-actions")
               | select((.external_id // "") | startswith($external_prefix))
               | . as $check
               | try (($check.external_id | ltrimstr($external_prefix)
                   | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                   | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty
               | select(.number < $current_number or
                   (.number == $current_number and .attempt < $current_attempt))
               | $check.id' <<<"$check_runs")
            while IFS= read -r prior_check_id; do
              [ -n "$prior_check_id" ] || continue
              [[ "$prior_check_id" =~ ^[0-9]+$ ]] || return 1
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${prior_check_id}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -f name="$CHECK_NAME" -f status=completed -f conclusion=cancelled \
                -f "output[title]=$CHECK_NAME" \
                -f "output[summary]=Superseded by a newer policy decision." >/dev/null
            done <<<"$prior_check_ids"
          }

          invalidate_observed_merge "$OBSERVED_MERGE_SHA"
          if [ -n "$SECONDARY_OBSERVED_MERGE_SHA" ] && \
             [ "$SECONDARY_OBSERVED_MERGE_SHA" != "$OBSERVED_MERGE_SHA" ]; then
            invalidate_observed_merge "$SECONDARY_OBSERVED_MERGE_SHA"
          fi

      - name: Report result on the exact candidate commit
        if: >-
          always() &&
          env.DEPENDABOT_PR != 'true' &&
          (steps.assess-policy.outputs.mode != 'preserve' ||
           steps.preserve-gate.outputs.valid != 'true') &&
          steps.assess-policy.outputs.mode != 'awaiting_rerun' &&
          steps.assess-policy.outputs.mode != 'superseded' &&
          steps.assess-policy.outputs.mode != 'stale_required' &&
          steps.assess-policy.outputs.mode != 'stale' &&
          steps.assess-policy.outputs.mode != 'merged' &&
          steps.assess-policy.outputs.mode != 'skip_closed'
        env:
          AUTHORIZATION_ACTOR: ${{ needs.policy.outputs.authorization_actor || '' }}
          AUTHORIZATION_ACTOR_ID: ${{ needs.policy.outputs.authorization_actor_id || 0 }}
          AUTHORIZATION_BOUNDARY: ${{ needs.policy.outputs.authorization_boundary || '' }}
          AUTHORIZATION_CREATED_AT: ${{ needs.policy.outputs.authorization_created_at || '' }}
          AUTHORIZATION_EPOCH: ${{ needs.policy.outputs.authorization_event_id || 0 }}
          BASE_REF: ${{ steps.assess-policy.outputs.fallback_base_ref || needs.policy.outputs.base_ref || github.event.pull_request.base.ref || '' }}
          BASE_SHA: ${{ steps.assess-policy.outputs.fallback_base_sha || needs.policy.outputs.base_sha || github.event.pull_request.base.sha || '' }}
          CHECK_NAME: llama.cpp authorized validation v2
          CHECK_RUN_ID: ${{ needs.validate.outputs.check_run_id }}
          CONCLUSION: ${{ steps.assess-policy.outputs.conclusion || 'failure' }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.assess-policy.outputs.fallback_head_sha || needs.policy.outputs.head_sha || github.event.pull_request.head.sha || '' }}
          MERGE_SHA: ${{ steps.assess-policy.outputs.fallback_merge_sha || needs.policy.outputs.merge_sha || github.event.merge_group.head_sha || github.event.pull_request.head.sha || '' }}
          METADATA_CHECK_NAME: llama.cpp authorization diagnostics v2
          MODE: ${{ steps.assess-policy.outputs.mode }}
          POLICY_HELPER: trusted-reconcile/.github/scripts/llamacpp_required_check_policy.py
          PRESERVE_VALID: ${{ steps.preserve-gate.outputs.valid || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SUMMARY: ${{ steps.assess-policy.outputs.summary || 'Validation assessment failed.' }}
          TARGET_KEY: ${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_sha) || format('pr-{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          oid_pattern='^[0-9a-fA-F]{40}$'
          if ! [[ "$MERGE_SHA" =~ $oid_pattern ]]; then
            echo "::error::Cannot report a required check without an exact candidate commit."
            exit 1
          fi

          if ! [[ "$AUTHORIZATION_EPOCH" =~ ^[0-9]+$ ]]; then
            AUTHORIZATION_EPOCH=0
          fi
          if [ "$MODE" = "preserve" ] && [ "$PRESERVE_VALID" != "true" ]; then
            CONCLUSION=failure
            SUMMARY="The live authorization epoch could not preserve this exact-commit gate."
          fi

          verify_live_candidate() {
            local pull_request current_number current_state current_merged
            local current_base_ref current_base current_head current_merge
            local current_mergeable current_candidate current_authorized
            local events_path provenance permission_response
            local authorization_actor authorization_actor_id
            local authorization_created_at authorization_event_id
            local authorization_event authorization_epoch_valid
            pull_request=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}") || return 1
            if ! jq -e --argjson number "$PR_NUMBER" \
              '.number == $number and .state == "open" and .merged == false and
               (.base.ref | type == "string") and (.base.sha | type == "string") and
               (.head.sha | type == "string") and
               ((.mergeable == null) or (.mergeable | type == "boolean")) and
               ((.merge_commit_sha == null) or (.merge_commit_sha | type == "string"))' \
              <<<"$pull_request" >/dev/null; then
              return 1
            fi
            current_number=$(jq -r '.number' <<<"$pull_request")
            current_state=$(jq -r '.state' <<<"$pull_request")
            current_merged=$(jq -r '.merged' <<<"$pull_request")
            current_base_ref=$(jq -r '.base.ref' <<<"$pull_request")
            current_base=$(jq -r '.base.sha' <<<"$pull_request")
            current_head=$(jq -r '.head.sha' <<<"$pull_request")
            current_merge=$(jq -r '.merge_commit_sha // empty' <<<"$pull_request")
            current_mergeable=$(jq -r \
              '.mergeable | if . == null then "null" else tostring end' \
              <<<"$pull_request")
            if [ "$current_number" != "$PR_NUMBER" ] || \
               [ "$current_state" != "open" ] || [ "$current_merged" != "false" ] || \
               ! git check-ref-format "refs/heads/${current_base_ref}" >/dev/null || \
               ! [[ "$current_base" =~ $oid_pattern && "$current_head" =~ $oid_pattern ]] || \
               { [ -n "$current_merge" ] && ! [[ "$current_merge" =~ $oid_pattern ]]; }; then
              return 1
            fi
            current_candidate="$current_head"
            if [ "$current_mergeable" = "true" ] && [[ "$current_merge" =~ $oid_pattern ]]; then
              current_candidate="$current_merge"
            fi
            if [ "$current_base_ref" != "$BASE_REF" ] || \
               [ "$current_base" != "$BASE_SHA" ] || \
               [ "$current_head" != "$HEAD_SHA" ] || \
               [ "$current_candidate" != "$MERGE_SHA" ]; then
              return 1
            fi

            if [ "$MODE" != "validate" ]; then
              return 0
            fi
            current_authorized=$(jq -r \
              'any(.labels[]?; .name == "ci:upgrades")' <<<"$pull_request")
            [ "$current_authorized" = "true" ] || return 1
            [ -n "$AUTHORIZATION_BOUNDARY" ] || return 1
            [ "$AUTHORIZATION_EPOCH" -gt 0 ] || return 1
            [ -f "$POLICY_HELPER" ] || return 1
            events_path=$(mktemp "${RUNNER_TEMP:-/tmp}/llamacpp-reconcile-events.XXXXXX")
            if ! gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events?per_page=100" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" > "$events_path"; then
              rm -f "$events_path"
              return 1
            fi
            provenance=$(python "$POLICY_HELPER" provenance --pages "$events_path" \
              --authorization-after "$AUTHORIZATION_BOUNDARY") || {
              rm -f "$events_path"
              return 1
            }
            rm -f "$events_path"
            authorization_actor=$(jq -er '.authorization_actor' <<<"$provenance") || return 1
            authorization_actor_id=$(jq -er '.authorization_actor_id' <<<"$provenance") || return 1
            authorization_created_at=$(jq -er '.authorization_created_at' <<<"$provenance") || return 1
            authorization_event_id=$(jq -er '.authorization_event_id' <<<"$provenance") || return 1
            authorization_event=$(jq -er '.authorization_event' <<<"$provenance") || return 1
            authorization_epoch_valid=$(jq -er \
              '.epoch_valid | if type == "boolean" then tostring else error("invalid epoch") end' \
              <<<"$provenance") || return 1
            if [ "$authorization_actor" != "$AUTHORIZATION_ACTOR" ] || \
               [ "$authorization_actor_id" != "$AUTHORIZATION_ACTOR_ID" ] || \
               [ "$authorization_created_at" != "$AUTHORIZATION_CREATED_AT" ] || \
               [ "$authorization_event_id" != "$AUTHORIZATION_EPOCH" ] || \
               [ "$authorization_event" != "labeled" ] || \
               [ "$authorization_epoch_valid" != "true" ]; then
              return 1
            fi
            permission_response=$(gh api \
              "repos/${GITHUB_REPOSITORY}/collaborators/${authorization_actor}/permission") || \
              return 1
            if ! jq -e --argjson actor_id "$authorization_actor_id" \
              '.user.id == $actor_id and
               (.permission == "admin" or .permission == "maintain" or
                .permission == "push" or .permission == "write")' \
              <<<"$permission_response" >/dev/null; then
              return 1
            fi
          }

          stale=false
          if [ "$CONCLUSION" = "success" ] && \
             [ "$EVENT_NAME" = "pull_request_target" ] && \
             ! verify_live_candidate; then
            stale=true
            CONCLUSION=failure
            SUMMARY="The pull request identity or authorization changed before reporting."
          fi

          decision_scope=metadata
          if [ "$EVENT_NAME" = "merge_group" ] || \
             [ "$EVENT_ACTION" = "opened" ] || \
             [ "$EVENT_ACTION" = "reopened" ] || \
             [ "$EVENT_ACTION" = "synchronize" ]; then
            decision_scope=required
          fi
          if [ "$decision_scope" = "metadata" ]; then
            CHECK_NAME="$METADATA_CHECK_NAME"
          fi
          external_prefix="lemonade-llamacpp-${decision_scope}-${TARGET_KEY}-"
          external_id="${external_prefix}${AUTHORIZATION_EPOCH}-${RUN_NUMBER}-${RUN_ATTEMPT}-${RUN_ID}"
          check_runs=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f check_name="$CHECK_NAME" -f filter=all -F per_page=100)

          IFS=$'\t' read -r newest_number newest_attempt < <(
            jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$external_prefix" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions")
                | select((.external_id // "") | startswith($external_prefix))
                | try ((.external_id | ltrimstr($external_prefix)
                    | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                    | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty]
               | sort_by(.number, .attempt)
               | (last // {number: 0, attempt: 0})
               | [.number, .attempt] | @tsv' <<<"$check_runs"
          )
          if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
             { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
               [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
            echo "::error::A newer policy run superseded this required-workflow run."
            exit 1
          fi

          if [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            CHECK_RUN_ID=$(jq -r --argjson check_run_id "$CHECK_RUN_ID" \
              --arg check_name "$CHECK_NAME" --arg external_id "$external_id" \
              '[.[] | .check_runs[]?
                | select(.id == $check_run_id and .name == $check_name and
                    .app.slug == "github-actions" and .external_id == $external_id)
                | .id] | last // empty' <<<"$check_runs")
          fi
          if ! [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            CHECK_RUN_ID=$(jq -r --arg check_name "$CHECK_NAME" \
              --arg external_id "$external_id" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions" and
                    .external_id == $external_id)
                | .id] | last // empty' <<<"$check_runs")
          fi

          if [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" -f status=completed -f conclusion="$CONCLUSION" \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -f "output[title]=$CHECK_NAME" -f "output[summary]=$SUMMARY" >/dev/null
          else
            response=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" -f head_sha="$MERGE_SHA" -f external_id="$external_id" \
              -f status=completed -f conclusion="$CONCLUSION" \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -f "output[title]=$CHECK_NAME" -f "output[summary]=$SUMMARY")
            CHECK_RUN_ID=$(jq -r '.id // empty' <<<"$response")
          fi
          if ! [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Checks API returned an invalid check-run ID."
            exit 1
          fi

          check_runs=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f check_name="$CHECK_NAME" -f filter=all -F per_page=100)
          IFS=$'\t' read -r newest_number newest_attempt < <(
            jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$external_prefix" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions")
                | select((.external_id // "") | startswith($external_prefix))
                | try ((.external_id | ltrimstr($external_prefix)
                    | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                    | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty]
               | sort_by(.number, .attempt)
               | (last // {number: 0, attempt: 0})
               | [.number, .attempt] | @tsv' <<<"$check_runs"
          )
          if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
             { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
               [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" -f status=completed -f conclusion=cancelled \
              -f "output[title]=$CHECK_NAME" \
              -f "output[summary]=Superseded by a newer policy decision." >/dev/null
            echo "::error::A newer policy run superseded this required-workflow run."
            exit 1
          fi

          if [ "$CONCLUSION" = "success" ] && \
             [ "$EVENT_NAME" = "pull_request_target" ] && \
             ! verify_live_candidate; then
            stale=true
            CONCLUSION=failure
            SUMMARY="The pull request identity or authorization changed after reporting."
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" -f status=completed -f conclusion=failure \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -f "output[title]=$CHECK_NAME" -f "output[summary]=$SUMMARY" >/dev/null
          fi

          prior_check_ids=$(jq -r \
            --arg check_name "$CHECK_NAME" \
            --arg external_prefix "$external_prefix" \
            --argjson current_number "$RUN_NUMBER" --argjson current_attempt "$RUN_ATTEMPT" \
            '.[] | .check_runs[]?
             | select(.name == $check_name and .app.slug == "github-actions")
             | select((.external_id // "") | startswith($external_prefix))
             | . as $check
             | try (($check.external_id | ltrimstr($external_prefix)
                 | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                 | {number: (.number | tonumber), attempt: (.attempt | tonumber)}) catch empty
             | select(.number < $current_number or
                 (.number == $current_number and .attempt < $current_attempt))
             | $check.id' <<<"$check_runs")
          while IFS= read -r prior_check_id; do
            [ -n "$prior_check_id" ] || continue
            [[ "$prior_check_id" =~ ^[0-9]+$ ]] || exit 1
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${prior_check_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" -f status=completed -f conclusion=cancelled \
              -f "output[title]=$CHECK_NAME" \
              -f "output[summary]=Superseded by a newer policy decision." >/dev/null
          done <<<"$prior_check_ids"
          [ "$stale" = "false" ]

      - name: Enforce policy result
        if: >-
          always() &&
          (steps.assess-policy.outputs.passed != 'true' ||
           (steps.assess-policy.outputs.mode == 'preserve' &&
            env.DEPENDABOT_PR != 'true' &&
            steps.preserve-gate.outputs.valid != 'true'))
        run: |
          echo "${{ steps.assess-policy.outputs.summary || 'Validation assessment failed.' }}"
          exit 1
