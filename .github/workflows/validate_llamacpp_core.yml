name: Validate llama.cpp

on:
  workflow_call:
    inputs:
      authorization_epoch:
        description: 'Trusted authorization issue-event ID; zero outside pull requests'
        type: string
        default: '0'
      lite:
        description: 'Run only the K2-Horizon 0.9B smoke model'
        type: boolean
        default: false
      models:
        description: 'Additional comma-separated IDs; empty uses hot models + K2 0.9B'
        type: string
        required: false
        default: ''
    secrets:
      HUGGINGFACE_ACCESS_TOKEN:
        required: false
    outputs:
      check_run_id:
        value: ${{ jobs.validate-invocation.outputs.check_run_id }}
      promotion_eligible:
        value: ${{ jobs.plan.outputs.promotion_eligible }}
      validation_matrix:
        value: ${{ jobs.plan.outputs.matrix }}
      llamacpp_release:
        value: ${{ jobs.get-latest-releases.outputs.llamacpp_release }}
      llamacpp_rocm_release:
        value: ${{ jobs.get-latest-releases.outputs.llamacpp_rocm_release }}
      llamacpp_lemonade_release:
        value: ${{ jobs.get-latest-releases.outputs.llamacpp_lemonade_release }}
      release_asset_manifest:
        value: ${{ jobs.verify-release-assets.outputs.release_asset_manifest }}
      ggml_update_backends:
        value: ${{ jobs.verify-release-assets.outputs.ggml_update_backends }}
      lemonade_update_backends:
        value: ${{ jobs.verify-release-assets.outputs.lemonade_update_backends }}
      rocm_update_backends:
        value: ${{ jobs.verify-release-assets.outputs.rocm_update_backends }}
      ggml_missing_count:
        value: ${{ jobs.verify-release-assets.outputs.ggml_missing_count }}
      rocm_nightly_missing_count:
        value: ${{ jobs.verify-release-assets.outputs.rocm_nightly_missing_count }}
      rocm_stable_missing_count:
        value: ${{ jobs.verify-release-assets.outputs.rocm_stable_missing_count }}
      cuda_missing_count:
        value: ${{ jobs.verify-release-assets.outputs.cuda_missing_count }}
      vulkan_available:
        value: ${{ jobs.verify-release-assets.outputs.vulkan_available }}
      cpu_available:
        value: ${{ jobs.verify-release-assets.outputs.cpu_available }}
      metal_available:
        value: ${{ jobs.verify-release-assets.outputs.metal_available }}
      rocm_nightly_available:
        value: ${{ jobs.verify-release-assets.outputs.rocm_nightly_available }}
      rocm_stable_available:
        value: ${{ jobs.verify-release-assets.outputs.rocm_stable_available }}
      cuda_available:
        value: ${{ jobs.verify-release-assets.outputs.cuda_available }}
permissions:
  contents: read

env:
  DEPENDABOT_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333 && github.event.pull_request.user.type == 'Bot' }}
  LEMONADE_CI_MODE: "True"
  PYTHONIOENCODING: utf-8

jobs:
  validate-invocation:
    name: Validate invocation
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    outputs:
      check_run_id: ${{ steps.start-check.outputs.check_run_id }}
    steps:
      - name: Reject untrusted caller events
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            merge_group|pull_request_target|schedule|workflow_dispatch)
              ;;
            *)
              echo "::error::Unsupported invocation event: $EVENT_NAME"
              exit 1
              ;;
          esac

      - name: Start authorized merge check
        id: start-check
        if: (github.event_name == 'pull_request_target' || github.event_name == 'merge_group') && env.DEPENDABOT_PR != 'true'
        env:
          AUTHORIZATION_EPOCH: ${{ inputs.authorization_epoch }}
          CHECK_NAME: llama.cpp authorized validation v2
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.merge_commit_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_KEY: ${{ github.event_name == 'merge_group' && format('merge-group-{0}', github.event.merge_group.head_sha) || format('pr-{0}', github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          EXTERNAL_PREFIX="lemonade-llamacpp-required-${TARGET_KEY}-"
          EXTERNAL_ID="${EXTERNAL_PREFIX}${AUTHORIZATION_EPOCH}-${RUN_NUMBER}-${RUN_ATTEMPT}-${RUN_ID}"
          if ! [[ "$AUTHORIZATION_EPOCH" =~ ^[0-9]+$ ]] || \
             ! [[ "$MERGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Protected validation requires an exact candidate commit."
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request_target" ] && \
             ! [[ "$AUTHORIZATION_EPOCH" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Pull-request validation requires a live authorization epoch."
            exit 1
          fi
          check_runs=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f check_name="$CHECK_NAME" \
            -f filter=all \
            -F per_page=100)

          IFS=$'\t' read -r newest_number newest_attempt < <(
            jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$EXTERNAL_PREFIX" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions")
                | select((.external_id // "") | startswith($external_prefix))
                | try ((.external_id | ltrimstr($external_prefix)
                    | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                    | {epoch: (.epoch | tonumber), number: (.number | tonumber),
                       attempt: (.attempt | tonumber)}) catch empty]
               | sort_by(.number, .attempt)
               | (last // {epoch: 0, number: 0, attempt: 0})
               | [.number, .attempt] | @tsv' <<<"$check_runs"
          )
          if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
             { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
               [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
            echo "::error::A newer GitHub Actions validation run already owns this exact-commit gate."
            exit 1
          fi

          check_run_id=$(jq -r --arg check_name "$CHECK_NAME" \
            --arg external_id "$EXTERNAL_ID" \
            '[.[] | .check_runs[]?
              | select(.name == $check_name and .app.slug == "github-actions" and
                  .external_id == $external_id)
              | .id] | last // empty' <<<"$check_runs")

          if [ -n "$check_run_id" ] && ! [[ "$check_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Checks API returned an invalid existing check-run ID."
            exit 1
          fi
          if [ -z "$check_run_id" ]; then
            response=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" \
              -f head_sha="$MERGE_SHA" \
              -f external_id="$EXTERNAL_ID" \
              -f status=in_progress \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
            check_run_id=$(jq -r '.id // empty' <<<"$response")
          else
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" \
              -f status=in_progress \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
          if ! [[ "$check_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Checks API returned an invalid check-run ID."
            exit 1
          fi

          check_runs=$(gh api --method GET --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/check-runs" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f check_name="$CHECK_NAME" \
            -f filter=all \
            -F per_page=100)
          IFS=$'\t' read -r newest_number newest_attempt < <(
            jq -r --arg check_name "$CHECK_NAME" --arg external_prefix "$EXTERNAL_PREFIX" \
              '[.[] | .check_runs[]?
                | select(.name == $check_name and .app.slug == "github-actions")
                | select((.external_id // "") | startswith($external_prefix))
                | try ((.external_id | ltrimstr($external_prefix)
                    | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                    | {epoch: (.epoch | tonumber), number: (.number | tonumber),
                       attempt: (.attempt | tonumber)}) catch empty]
               | sort_by(.number, .attempt)
               | (last // {epoch: 0, number: 0, attempt: 0})
               | [.number, .attempt] | @tsv' <<<"$check_runs"
          )
          if [ "$newest_number" -gt "$RUN_NUMBER" ] || \
             { [ "$newest_number" -eq "$RUN_NUMBER" ] && \
               [ "$newest_attempt" -gt "$RUN_ATTEMPT" ]; }; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${check_run_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" \
              -f status=completed \
              -f conclusion=cancelled \
              -f "output[title]=$CHECK_NAME" \
              -f "output[summary]=Superseded by a newer policy decision." >/dev/null
            echo "::error::A newer GitHub Actions validation run superseded this check."
            exit 1
          fi

          prior_check_ids=$(jq -r \
            --arg check_name "$CHECK_NAME" \
            --arg external_prefix "$EXTERNAL_PREFIX" \
            --argjson current_number "$RUN_NUMBER" --argjson current_attempt "$RUN_ATTEMPT" \
            '.[] | .check_runs[]?
             | select(.name == $check_name and .app.slug == "github-actions")
             | select((.external_id // "") | startswith($external_prefix))
             | . as $check
             | try (($check.external_id | ltrimstr($external_prefix)
                 | capture("^(?<epoch>[0-9]+)-(?<number>[0-9]+)-(?<attempt>[0-9]+)-(?<id>[0-9]+)$"))
                 | {epoch: (.epoch | tonumber), number: (.number | tonumber),
                    attempt: (.attempt | tonumber)}) catch empty
             | select(.number < $current_number or
                 (.number == $current_number and .attempt < $current_attempt))
             | $check.id' <<<"$check_runs")
          while IFS= read -r prior_check_id; do
            [ -n "$prior_check_id" ] || continue
            if ! [[ "$prior_check_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Checks API returned an invalid prior check-run ID."
              exit 1
            fi
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/check-runs/${prior_check_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -f name="$CHECK_NAME" \
              -f status=completed \
              -f conclusion=cancelled \
              -f "output[title]=$CHECK_NAME" \
              -f "output[summary]=Superseded by a newer authorized validation run." >/dev/null
          done <<<"$prior_check_ids"

          echo "check_run_id=$check_run_id" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan validation
    needs: validate-invocation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.protected-plan.outputs.matrix || steps.branch-plan.outputs.matrix }}
      promotion_eligible: ${{ steps.protected-plan.outputs.promotion_eligible || steps.branch-plan.outputs.promotion_eligible }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Build trusted protected-change matrix
        id: protected-plan
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          matrix=$(jq -cn '{
            include: [
              {
                target: "windows-vulkan",
                backend: "vulkan",
                channel: "",
                managed_pin: "vulkan",
                build_platform: "windows",
                runner: ["self-hosted", "Windows", "128gb", "vulkan", "lemon-prod"],
                models: [
                  "K2-Horizon-0.9B-GGUF",
                  "K2-Horizon-3.7B-GGUF",
                  "K2-Horizon-7B-GGUF"
                ],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "linux-vulkan",
                backend: "vulkan",
                channel: "",
                managed_pin: "vulkan",
                build_platform: "linux",
                runner: ["self-hosted", "Linux", "vulkan", "lemon-prod"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "linux-cpu",
                backend: "cpu",
                channel: "",
                managed_pin: "cpu",
                build_platform: "linux",
                runner: ["self-hosted", "Linux", "lemon-prod"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "macos-metal",
                backend: "metal",
                channel: "",
                managed_pin: "metal",
                build_platform: "macos",
                runner: ["macos-latest"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "windows-cuda",
                backend: "cuda",
                channel: "",
                managed_pin: "cuda",
                build_platform: "windows",
                runner: ["self-hosted", "Windows", "cuda", "lemon-prod"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "windows-rocm-stable",
                backend: "rocm",
                channel: "stable",
                managed_pin: "rocm-stable",
                build_platform: "windows",
                runner: ["self-hosted", "Windows", "stx-halo", "rocm", "lemon-prod"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              },
              {
                target: "windows-rocm-nightly",
                backend: "rocm",
                channel: "nightly",
                managed_pin: "rocm-nightly",
                build_platform: "windows",
                runner: ["self-hosted", "Windows", "stx-halo", "rocm", "lemon-prod"],
                models: ["K2-Horizon-0.9B-GGUF"],
                capability_profile: "k2-horizon-v1",
                capability_models: ["K2-Horizon-0.9B-GGUF"],
                lite: false
              }
            ]
          }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "promotion_eligible=false" >> "$GITHUB_OUTPUT"
      - name: Build branch validation matrix
        id: branch-plan
        if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODELS: ${{ inputs.models || '' }}
          MANUAL_LITE: ${{ inputs.lite || false }}
        run: >-
          python -m test.utils.llamacpp_validation_plan
          --event "$EVENT_NAME"
          --models "$MANUAL_MODELS"
          --lite "$MANUAL_LITE"

  # ========================================================================
  # Discover the latest llama.cpp release for each upstream repo
  # ========================================================================
  get-latest-releases:
    name: Get latest releases
    # Only the auto-update runs resolve upstream releases. Everywhere else the
    # build validates the pins committed in backend_versions.json, so a bad
    # upstream release can't fail a merge or hide a broken pin.
    needs: validate-invocation
    if: needs.validate-invocation.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      llamacpp_release: ${{ steps.llamacpp.outputs.release }}
      llamacpp_rocm_release: ${{ steps.llamacpp_rocm.outputs.release }}
      llamacpp_lemonade_release: ${{ steps.llamacpp_lemonade.outputs.release }}
    steps:
      - name: Get latest llama.cpp release
        id: llamacpp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Upstream's semver releases (v0.3.0) are what /releases/latest now
          # returns, and they carry no binaries -- the bNNNN nightlies hold the
          # assets and are flagged as prereleases.
          TAGS=$(gh api repos/ggml-org/llama.cpp/releases \
            --jq '.[] | select(.draft | not) | .tag_name')
          RELEASE=$(printf '%s\n' "$TAGS" | grep -m1 -E '^b[0-9]+$' || true)
          if [ -z "$RELEASE" ]; then
            echo "::error::No bNNNN release found in ggml-org/llama.cpp."
            exit 1
          fi
          echo "Latest llama.cpp release: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Get latest llamacpp-rocm release
        id: llamacpp_rocm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh api repos/lemonade-sdk/llamacpp-rocm/releases/latest --jq '.tag_name')
          echo "Latest llamacpp-rocm release: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Get latest lemonade-sdk/llama.cpp release
        id: llamacpp_lemonade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh api repos/lemonade-sdk/llama.cpp/releases/latest --jq '.tag_name')
          echo "Latest lemonade-sdk/llama.cpp release: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  # ========================================================================
  # Build binaries with updated backend versions
  # ========================================================================
  verify-release-assets:
    name: Verify release assets
    needs: get-latest-releases
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ggml_update_backends: ${{ steps.assets.outputs.ggml_update_backends }}
      lemonade_update_backends: ${{ steps.assets.outputs.lemonade_update_backends }}
      rocm_update_backends: ${{ steps.assets.outputs.rocm_update_backends }}
      ggml_missing_count: ${{ steps.assets.outputs.ggml_missing_count }}
      rocm_nightly_missing_count: ${{ steps.assets.outputs.rocm_nightly_missing_count }}
      rocm_stable_missing_count: ${{ steps.assets.outputs.rocm_stable_missing_count }}
      cuda_missing_count: ${{ steps.assets.outputs.cuda_missing_count }}
      vulkan_available: ${{ steps.assets.outputs.vulkan_available }}
      cpu_available: ${{ steps.assets.outputs.cpu_available }}
      metal_available: ${{ steps.assets.outputs.metal_available }}
      rocm_nightly_available: ${{ steps.assets.outputs.rocm_nightly_available }}
      rocm_stable_available: ${{ steps.assets.outputs.rocm_stable_available }}
      cuda_available: ${{ steps.assets.outputs.cuda_available }}
      release_asset_manifest: ${{ steps.manifest.outputs.release_asset_manifest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch release asset lists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GGML_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_release }}
          ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_rocm_release }}
          LEMONADE_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_lemonade_release }}
        run: |
          set -euo pipefail

          for value in GGML_RELEASE ROCM_RELEASE LEMONADE_RELEASE; do
            if [ -z "${!value}" ]; then
              echo "::error::$value was not resolved."
              exit 1
            fi
          done

          gh api "repos/ggml-org/llama.cpp/releases/tags/${GGML_RELEASE}" \
            > ggml_release.json
          gh api "repos/lemonade-sdk/llamacpp-rocm/releases/tags/${ROCM_RELEASE}" \
            > rocm_release.json
          gh api "repos/lemonade-sdk/llama.cpp/releases/tags/${LEMONADE_RELEASE}" \
            > lemonade_release.json

          source_repository=ggml-org/llama.cpp
          source_manifest_max_bytes=65536
          source_manifest_directory=$(mktemp -d)
          source_default_branch=$(gh api "repos/${source_repository}" --jq '.default_branch')
          if [ -z "$source_default_branch" ]; then
            echo "::error::Could not resolve the ${source_repository} default branch."
            exit 1
          fi
          upstream_reference="refs/heads/${source_default_branch}"
          upstream_reference_head=$(gh api \
            "repos/${source_repository}/commits/heads/${source_default_branch}" \
            --jq '.sha')
          if ! [[ "$upstream_reference_head" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not resolve ${upstream_reference} to a full commit."
            exit 1
          fi

          attach_release_claims() {
            local repository="$1"
            local tag="$2"
            local path="$3"
            local release_tag_commit publisher_claim_type
            local publisher_claimed_source_commit comparison_path
            local source_manifest_asset_id source_manifest_path
            local build_target_attestation_path
            release_tag_commit=$(gh api \
              "repos/${repository}/commits/tags/${tag}" --jq '.sha')
            if ! [[ "$release_tag_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Could not resolve ${repository} ${tag} to a release tag commit."
              exit 1
            fi
            if [ "$repository" = "$source_repository" ]; then
              publisher_claim_type="source-release-tag"
              publisher_claimed_source_commit="$release_tag_commit"
              build_target_attestation_path="${source_manifest_directory}/source-release-targets.json"
              printf '[]\n' > "$build_target_attestation_path"
            else
              publisher_claim_type="immutable-source-manifest"
              source_manifest_asset_id=$(python -m test.utils.llamacpp_release_manifest \
                --source-manifest-asset-id "$path" "$repository")
              source_manifest_path="${source_manifest_directory}/source-${source_manifest_asset_id}.json"
              build_target_attestation_path="${source_manifest_path}.build-targets"
              gh api "repos/${repository}/releases/assets/${source_manifest_asset_id}" \
                -H "Accept: application/octet-stream" |
                head -c "$((source_manifest_max_bytes + 1))" > "$source_manifest_path"
              publisher_claimed_source_commit=$(python -m test.utils.llamacpp_release_manifest \
                --validate-source-manifest "$source_manifest_path" "$path" \
                "$repository" "$tag" "$release_tag_commit" \
                --build-target-attestation-output "$build_target_attestation_path")
            fi
            if ! [[ "$publisher_claimed_source_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::${repository} ${tag} did not bind one full upstream source commit."
              exit 1
            fi
            comparison_path="${path}.upstream-comparison.json"
            gh api \
              "repos/${source_repository}/compare/${publisher_claimed_source_commit}...${upstream_reference_head}" \
              > "$comparison_path"
            python -m test.utils.llamacpp_release_manifest \
              --require-upstream-ancestry "$comparison_path" "$source_repository" \
              "$publisher_claimed_source_commit" "$upstream_reference_head"
            jq \
              --slurpfile build_target_attestations "$build_target_attestation_path" \
              --arg publisher_claim_type "$publisher_claim_type" \
              --arg publisher_claimed_source_commit "$publisher_claimed_source_commit" \
              --arg release_tag_commit "$release_tag_commit" \
              --arg source_repository "$source_repository" \
              --arg upstream_reference "$upstream_reference" \
              --arg upstream_reference_head "$upstream_reference_head" \
              '.build_target_attestations = $build_target_attestations[0]
               | .publisher_claim_type = $publisher_claim_type
               | .publisher_claimed_source_commit = $publisher_claimed_source_commit
               | .release_tag_commit = $release_tag_commit
               | .source_repository = $source_repository
               | .upstream_reference = $upstream_reference
               | .upstream_reference_head = $upstream_reference_head
               | del(.source_commit)' \
              "$path" > "${path}.with-source"
            mv "${path}.with-source" "$path"
          }
          attach_release_claims ggml-org/llama.cpp "$GGML_RELEASE" ggml_release.json
          attach_release_claims lemonade-sdk/llamacpp-rocm \
            "$ROCM_RELEASE" rocm_release.json
          attach_release_claims lemonade-sdk/llama.cpp \
            "$LEMONADE_RELEASE" lemonade_release.json

          jq -r '.assets[].name' ggml_release.json | sort > ggml_assets.txt
          jq -r '.assets[].name' rocm_release.json | sort > rocm_assets.txt
          jq -r '.assets[].name' lemonade_release.json | sort > lemonade_assets.txt

          echo "ggml-org/llama.cpp assets for ${GGML_RELEASE}:"
          cat ggml_assets.txt
          echo "lemonade-sdk/llamacpp-rocm assets for ${ROCM_RELEASE}:"
          cat rocm_assets.txt
          echo "lemonade-sdk/llama.cpp assets for ${LEMONADE_RELEASE}:"
          cat lemonade_assets.txt

      - name: Capture release asset manifest
        id: manifest
        env:
          GGML_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_release }}
          ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_rocm_release }}
          LEMONADE_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_lemonade_release }}
        run: >-
          python -m test.utils.llamacpp_release_manifest
          --release ggml-org/llama.cpp "$GGML_RELEASE" ggml_release.json
          --release lemonade-sdk/llamacpp-rocm "$ROCM_RELEASE" rocm_release.json
          --release lemonade-sdk/llama.cpp "$LEMONADE_RELEASE" lemonade_release.json
          --github-output "$GITHUB_OUTPUT"

      - name: Verify expected asset families
        id: assets
        env:
          GGML_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_release }}
          ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_rocm_release }}
          LEMONADE_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_lemonade_release }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from test.utils.llamacpp_release_assets import (
              build_asset_requirements,
              build_rocm_asset_target_requirements,
              evaluate_asset_group,
          )

          def read_asset_metadata(path):
              release = json.loads(Path(path).read_text(encoding="utf-8"))
              asset_sizes = {}
              for asset in release["assets"]:
                  asset_sizes[asset["name"]] = asset["size"]
              attested_targets = {
                  attestation["name"]: attestation["build_targets"]
                  for attestation in release.get("build_target_attestations", [])
              }
              return asset_sizes, attested_targets

          def update_outputs(values):
              github_output = os.environ.get("GITHUB_OUTPUT")
              if not github_output:
                  return
              with open(github_output, "a", encoding="utf-8") as out:
                  for key, value in values.items():
                      out.write(f"{key}={value}\n")

          def report_group(
              name,
              available_assets,
              backend_requirements,
              **evaluation_options,
          ):
              update_backends, missing_by_backend = evaluate_asset_group(
                  available_assets, backend_requirements, **evaluation_options
              )
              for backend, required in backend_requirements.items():
                  missing = missing_by_backend[backend]
                  if missing:
                      print(f"{name}: {backend} assets incomplete; keeping existing pin.")
                      for asset in missing:
                          print(f"  missing: {asset}")
                  else:
                      print(f"{name}: {backend} assets complete; pin may update.")
              return update_backends, missing_by_backend

          ggml_release = os.environ["GGML_RELEASE"]
          rocm_release = os.environ["ROCM_RELEASE"]
          lemonade_release = os.environ["LEMONADE_RELEASE"]

          ggml_assets, _ = read_asset_metadata("ggml_release.json")
          rocm_assets, rocm_attested_targets = read_asset_metadata("rocm_release.json")
          lemonade_assets, _ = read_asset_metadata("lemonade_release.json")

          with open("src/cpp/resources/backend_versions.json", encoding="utf-8") as f:
              versions = json.load(f)

          requirements = build_asset_requirements(
              ggml_release=ggml_release,
              rocm_release=rocm_release,
              lemonade_release=lemonade_release,
              backend_versions=versions,
          )
          rocm_target_requirements = build_rocm_asset_target_requirements(
              rocm_release=rocm_release,
              backend_versions=versions,
          )

          ggml_updates, ggml_missing = report_group(
              "ggml-org/llama.cpp", ggml_assets, requirements["ggml"]
          )
          rocm_updates, rocm_missing = report_group(
              "lemonade-sdk/llamacpp-rocm",
              rocm_assets,
              requirements["rocm"],
              required_asset_targets=rocm_target_requirements,
              attested_asset_targets=rocm_attested_targets,
          )
          lemonade_updates, lemonade_missing = report_group(
              "lemonade-sdk/llama.cpp", lemonade_assets, requirements["lemonade"]
          )

          values = {
              "ggml_update_backends": ",".join(ggml_updates),
              "lemonade_update_backends": ",".join(lemonade_updates),
              "rocm_update_backends": ",".join(rocm_updates),
              "ggml_missing_count": str(sum(len(items) for items in ggml_missing.values())),
              "rocm_nightly_missing_count": str(len(rocm_missing["rocm-nightly"])),
              "rocm_stable_missing_count": str(len(lemonade_missing["rocm-stable"])),
              "cuda_missing_count": str(len(lemonade_missing["cuda"])),
              "vulkan_available": "true" if not ggml_missing["vulkan"] else "false",
              "cpu_available": "true" if not ggml_missing["cpu"] else "false",
              "metal_available": "true" if not ggml_missing["metal"] else "false",
              "rocm_nightly_available": "true" if not rocm_missing["rocm-nightly"] else "false",
              "rocm_stable_available": "true" if not lemonade_missing["rocm-stable"] else "false",
              "cuda_available": "true" if not lemonade_missing["cuda"] else "false",
          }
          update_outputs(values)

          print("Eligible ggml-org/llama.cpp backend updates: " + (values["ggml_update_backends"] or "none"))
          print("Eligible lemonade-sdk/llamacpp-rocm backend updates: " + (values["rocm_update_backends"] or "none"))
          print("Eligible lemonade-sdk/llama.cpp backend updates: " + (values["lemonade_update_backends"] or "none"))
          PY

  verify-protected-release-manifest:
    name: Verify protected release manifest
    needs: validate-invocation
    if: >-
      needs.validate-invocation.result == 'success' &&
      (github.event_name == 'pull_request_target' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected candidate commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check out trusted validation tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Verify managed llama.cpp pins
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash trusted/.github/scripts/verify_llamacpp_pin_manifest.sh
          "$GITHUB_WORKSPACE/trusted" "$GITHUB_WORKSPACE/candidate"
          "$BASE_SHA" "$CANDIDATE_SHA"

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate-invocation, get-latest-releases, verify-release-assets, verify-protected-release-manifest, plan]
    if: always() && !failure() && !cancelled()
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VALIDATION_CANDIDATE_ROOT: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
    steps:
      - name: Prepare Windows runner for long paths and stale workspace caches
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          $ErrorActionPreference = "Continue"

          # 1. Kill any running/orphaned processes to release file locks
          $patterns = @("lemonade", "lemond", "llama-server", "llama", "flm", "ort-server", "moonshine-server", "wscript", "LemonadeServer")
          foreach ($p in $patterns) {
              Get-Process | Where-Object { $_.ProcessName -like "*$p*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          }


      - name: Check out validation control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - name: Check out the validation candidate
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          path: candidate
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - name: Verify authorized merge commit
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD^1)" = "$BASE_SHA" || {
            echo "::error::The merge commit does not contain the authorized base commit."
            exit 1
          }
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD^2)" = "$HEAD_SHA" || {
            echo "::error::The merge commit does not contain the authorized pull request head."
            exit 1
          }

      - name: Verify merge-group commit
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD)" = "$MERGE_GROUP_SHA" || {
            echo "::error::The checkout does not match the authorized merge-group commit."
            exit 1
          }

      - name: Update backend_versions.json
        if: needs.get-latest-releases.result == 'success'
        shell: bash
        working-directory: ${{ env.VALIDATION_CANDIDATE_ROOT }}
        env:
          LLAMACPP_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_release }}
          LLAMACPP_ROCM_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_rocm_release }}
          LLAMACPP_LEMONADE_RELEASE: ${{ needs.get-latest-releases.outputs.llamacpp_lemonade_release }}
          LLAMACPP_GGML_UPDATE_BACKENDS: ${{ needs.verify-release-assets.outputs.ggml_update_backends }}
          LLAMACPP_ROCM_UPDATE_BACKENDS: ${{ needs.verify-release-assets.outputs.rocm_update_backends }}
          LLAMACPP_LEMONADE_UPDATE_BACKENDS: ${{ needs.verify-release-assets.outputs.lemonade_update_backends }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          RELEASE_RE = re.compile(r"^b[0-9]+$")

          def parse_csv(value):
              return [item.strip() for item in (value or "").split(",") if item.strip()]

          def update(section, release, backends):
              if not backends:
                  return []
              if not RELEASE_RE.match(release):
                  raise SystemExit(f"Invalid llama.cpp release tag: {release}")
              changed = []
              for key in backends:
                  if key not in section:
                      raise SystemExit(f"Refusing to create missing llamacpp.{key}")
                  if not isinstance(section[key], str):
                      raise SystemExit(f"llamacpp.{key} must be a string")
                  old = section[key]
                  section[key] = release
                  changed.append((key, old, release))
              return changed

          path = Path("src/cpp/resources/backend_versions.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          section = data.get("llamacpp")
          if not isinstance(section, dict):
              raise SystemExit("backend_versions.json is missing a llamacpp object")

          changes = []
          changes += update(section, os.environ["LLAMACPP_RELEASE"], parse_csv(os.environ.get("LLAMACPP_GGML_UPDATE_BACKENDS", "")))
          changes += update(section, os.environ["LLAMACPP_ROCM_RELEASE"], parse_csv(os.environ.get("LLAMACPP_ROCM_UPDATE_BACKENDS", "")))
          changes += update(section, os.environ["LLAMACPP_LEMONADE_RELEASE"], parse_csv(os.environ.get("LLAMACPP_LEMONADE_UPDATE_BACKENDS", "")))

          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          print("Updated llamacpp backend versions:")
          if changes:
              for key, old, new in changes:
                  print(f"  llamacpp.{key}: {old} -> {new}")
          else:
              print("  none")
          PY

      - name: Stage protected validation-only model catalog
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          candidate_catalog="$GITHUB_WORKSPACE/candidate/src/cpp/resources/server_models.json"
          python - "$GITHUB_WORKSPACE/candidate" "$candidate_catalog" <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          candidate_root = Path(sys.argv[1]).resolve(strict=True)
          catalog_path = Path(sys.argv[2])
          resolved_catalog = catalog_path.resolve(strict=True)
          try:
              resolved_catalog.relative_to(candidate_root)
          except ValueError as exc:
              raise SystemExit("candidate catalog escapes its checkout") from exc
          if not stat.S_ISREG(os.lstat(catalog_path).st_mode):
              raise SystemExit("candidate catalog must be a regular file")
          PY
          python "$GITHUB_WORKSPACE/test/utils/validation_model_catalog.py" \
            --base "$candidate_catalog" \
            --overlay "$GITHUB_WORKSPACE/test/fixtures/llamacpp_validation_models.json" \
            --output "$candidate_catalog"

      - name: Stage branch validation-only model catalog
        if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        working-directory: ${{ env.VALIDATION_CANDIDATE_ROOT }}
        run: >-
          python -m test.utils.validation_model_catalog
          --base src/cpp/resources/server_models.json
          --overlay test/fixtures/llamacpp_validation_models.json
          --output src/cpp/resources/server_models.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ env.VALIDATION_CANDIDATE_ROOT }}
        run: ./setup.sh

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Build lemond on Windows
        if: runner.os == 'Windows'
        shell: PowerShell
        working-directory: ${{ env.VALIDATION_CANDIDATE_ROOT }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Building Lemonade server binaries..." -ForegroundColor Cyan
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          # The validation drives lemond over HTTP and never invokes the CLI,
          # so lemond is the only target it needs.
          cmake --preset vs18 -DBUILD_WEB_APP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # /m:2 goes straight to MSBuild rather than through --parallel, which
          # makes CMake set CL_MPCount=1 and cancel the /MP in CMakeLists.txt.
          # Capped at 2 because /MP already spawns one cl.exe per core.
          cmake --build build --config Release --target lemond -- /m:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "build\Release\lemond.exe")) {
              Write-Host "ERROR: lemond.exe not found!" -ForegroundColor Red
              exit 1
          }
          Write-Host "Build successful!" -ForegroundColor Green

      - name: Build lemond on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ${{ env.VALIDATION_CANDIDATE_ROOT }}
        run: |
          set -euo pipefail
          cmake --preset default -DBUILD_WEB_APP=OFF -DBUILD_TESTING=OFF
          cmake --build --preset default --target lemond --parallel 2
          test -x build/lemond
          build/lemond --version

      - name: Upload Windows build artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llamacpp-build-${{ matrix.platform }}
          path: |
            ${{ env.VALIDATION_CANDIDATE_ROOT }}/build/Release/
            ${{ env.VALIDATION_CANDIDATE_ROOT }}/build/resources/
          retention-days: 7

      - name: Upload Linux or macOS build artifacts
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llamacpp-build-${{ matrix.platform }}
          path: |
            ${{ env.VALIDATION_CANDIDATE_ROOT }}/build/lemond
            ${{ env.VALIDATION_CANDIDATE_ROOT }}/build/resources/
          retention-days: 7

  # ========================================================================
  # Validate backends on self-hosted runner
  # ========================================================================
  validate:
    name: Validate ${{ matrix.target }}
    needs: [get-latest-releases, build, plan]
    if: always() && needs.build.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VALIDATION_CANDIDATE_ROOT: ${{ (github.event_name == 'pull_request_target' || github.event_name == 'merge_group') && format('{0}/candidate', github.workspace) || github.workspace }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Capture Vulkan runner configuration
        if: matrix.backend == 'vulkan' && runner.os == 'Windows'
        shell: PowerShell
        run: |
          $ErrorActionPreference = "Continue"

          $outDir = Join-Path $env:RUNNER_TEMP "vulkan-runner-config"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # General system / Windows / BIOS information
          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem
          $bios = Get-CimInstance Win32_BIOS

          [pscustomobject]@{
            CapturedUtc        = (Get-Date).ToUniversalTime()
            RunnerName         = $env:RUNNER_NAME
            Manufacturer       = $computer.Manufacturer
            Model              = $computer.Model
            PhysicalMemoryGiB  = [math]::Round(
              $computer.TotalPhysicalMemory / 1GB,
              2
            )
            WindowsCaption     = $os.Caption
            WindowsVersion     = $os.Version
            WindowsBuild       = $os.BuildNumber
            OSArchitecture     = $os.OSArchitecture
            LastBootUpTime     = $os.LastBootUpTime
            UptimeHours        = [math]::Round(
              ((Get-Date) - $os.LastBootUpTime).TotalHours,
              2
            )
            BIOSManufacturer   = $bios.Manufacturer
            BIOSVersion        = $bios.SMBIOSBIOSVersion
            BIOSReleaseDate    = $bios.ReleaseDate
          } |
            Format-List |
            Out-File (Join-Path $outDir "system.txt") -Encoding utf8

          # GPU model, PCI device ID and Windows display-driver information
          Get-CimInstance Win32_VideoController |
            Select-Object `
              Name,
              VideoProcessor,
              PNPDeviceID,
              DriverVersion,
              DriverDate,
              Status |
            Format-List |
            Out-File (Join-Path $outDir "gpu.txt") -Encoding utf8

          Get-CimInstance Win32_PnPSignedDriver |
            Where-Object { $_.DeviceClass -eq "DISPLAY" } |
            Select-Object `
              DeviceName,
              Manufacturer,
              DriverProviderName,
              DriverVersion,
              DriverDate,
              InfName,
              DeviceID |
            Format-List |
            Out-File (Join-Path $outDir "display-drivers.txt") -Encoding utf8

          # Current Windows power scheme
          powercfg /getactivescheme 2>&1 |
            Out-File (Join-Path $outDir "power.txt") -Encoding utf8

          # Reboot-frequency proxy plus exact current boot time above
          $bootEvents = @(
            Get-WinEvent -FilterHashtable @{
              LogName   = "System"
              Id        = 6005
              StartTime = (Get-Date).AddDays(-30)
            } -ErrorAction SilentlyContinue
          )

          "Event Log service starts in last 30 days: $($bootEvents.Count)" |
            Out-File (Join-Path $outDir "reboots.txt") -Encoding utf8

          # Relevant workloads present before validation cleanup
          $processes = @(
            Get-Process -Name @(
              "lemond",
              "llama-server",
              "lemonade",
              "LemonadeServer",
              "flm",
              "ort-server",
              "moonshine-server"
            ) -ErrorAction SilentlyContinue
          )

          if ($processes.Count -gt 0) {
            $processes |
              Select-Object ProcessName, Id, StartTime, CPU, WorkingSet64 |
              Format-Table -AutoSize |
              Out-File (Join-Path $outDir "processes-before-cleanup.txt") `
                -Encoding utf8
          } else {
            "No known inference processes detected." |
              Out-File (Join-Path $outDir "processes-before-cleanup.txt") `
                -Encoding utf8
          }

          # Best-effort AMD cache-directory state.
          # This does not modify or clear any cache.
          $amdRoot = if ($env:LOCALAPPDATA) {
            Join-Path $env:LOCALAPPDATA "AMD"
          } else {
            $null
          }

          if ($amdRoot -and (Test-Path $amdRoot)) {
            Get-ChildItem $amdRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "cache" } |
              Select-Object Name, CreationTimeUtc, LastWriteTimeUtc |
              Format-Table -AutoSize |
              Out-File (Join-Path $outDir "amd-cache-state.txt") `
                -Encoding utf8
          } else {
            "AMD local cache directory not found." |
              Out-File (Join-Path $outDir "amd-cache-state.txt") `
                -Encoding utf8
          }

          # Vulkan device, driver, memory heaps and capabilities
          $vulkaninfo = Get-Command vulkaninfo -ErrorAction SilentlyContinue

          if ($vulkaninfo) {
            & $vulkaninfo.Source --summary *>&1 |
              Out-File (Join-Path $outDir "vulkaninfo-summary.txt") `
                -Encoding utf8
            $summaryExitCode = $LASTEXITCODE

            & $vulkaninfo.Source *>&1 |
              Out-File (Join-Path $outDir "vulkaninfo.txt") `
                -Encoding utf8
            $fullExitCode = $LASTEXITCODE

            Write-Host "=== vulkaninfo --summary ==="
            Get-Content (Join-Path $outDir "vulkaninfo-summary.txt")

            Write-Host "vulkaninfo summary exit code: $summaryExitCode"
            Write-Host "vulkaninfo full exit code: $fullExitCode"
          } else {
            "vulkaninfo was not found in PATH." |
              Out-File (Join-Path $outDir "vulkaninfo-unavailable.txt") `
                -Encoding utf8
            Write-Warning "vulkaninfo was not found in PATH."
          }

          Write-Host "=== Runner configuration ==="
          Get-Content (Join-Path $outDir "system.txt")
          Get-Content (Join-Path $outDir "gpu.txt")
          Get-Content (Join-Path $outDir "display-drivers.txt")
          Get-Content (Join-Path $outDir "power.txt")
          Get-Content (Join-Path $outDir "reboots.txt")
          Get-Content (Join-Path $outDir "processes-before-cleanup.txt")

          # Environment collection should never make validation fail.
          exit 0

      - name: Capture Vulkan runner configuration on Linux
        if: matrix.backend == 'vulkan' && runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          output_directory="$RUNNER_TEMP/vulkan-runner-config"
          mkdir -p "$output_directory"
          uname -a > "$output_directory/system.txt"
          if command -v vulkaninfo >/dev/null 2>&1; then
            vulkaninfo --summary > "$output_directory/vulkaninfo-summary.txt" 2>&1
            vulkaninfo > "$output_directory/vulkaninfo.txt" 2>&1
          else
            echo "vulkaninfo was not found in PATH." \
              > "$output_directory/vulkaninfo-unavailable.txt"
          fi
          exit 0

      - name: Upload Vulkan runner configuration
        if: always() && matrix.backend == 'vulkan'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: vulkan-runner-config-${{ matrix.target }}
          path: ${{ runner.temp }}/vulkan-runner-config/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup prior validation processes
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          $ErrorActionPreference = "Stop"
          $workspaceRoot = [IO.Path]::GetFullPath(
            $env:VALIDATION_CANDIDATE_ROOT
          )
          $lemondPath = [IO.Path]::GetFullPath(
            (Join-Path $workspaceRoot "build\Release\lemond.exe")
          )
          $cachePrefix = [IO.Path]::GetFullPath(
            (Join-Path $workspaceRoot "ci-cache-")
          )
          $staleProcesses = @(
            Get-CimInstance Win32_Process `
              -Filter "Name = 'lemond.exe' OR Name = 'llama-server.exe'" `
              -ErrorAction SilentlyContinue | Where-Object {
                $_.ExecutablePath -and (
                  ($_.Name -eq "lemond.exe" -and $_.ExecutablePath.Equals(
                    $lemondPath,
                    [StringComparison]::OrdinalIgnoreCase
                  )) -or
                  ($_.Name -eq "llama-server.exe" -and $_.ExecutablePath.StartsWith(
                    $cachePrefix,
                    [StringComparison]::OrdinalIgnoreCase
                  ))
                )
              }
          )

          foreach ($process in $staleProcesses) {
            Write-Host "Stopping stale $($process.Name) PID $($process.ProcessId)." `
              -ForegroundColor Yellow
            Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
          }
          if ($staleProcesses.Count -gt 0) {
            Start-Sleep -Seconds 1
            foreach ($process in $staleProcesses) {
              if (Get-Process -Id $process.ProcessId -ErrorAction SilentlyContinue) {
                throw "Failed to stop workspace process PID $($process.ProcessId)."
              }
            }
          }

      - name: Check out validation control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - name: Check out the validation candidate
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          path: candidate
          persist-credentials: false
          clean: true
          fetch-depth: 2

      - name: Verify authorized merge commit
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD^1)" = "$BASE_SHA" || {
            echo "::error::The merge commit does not contain the authorized base commit."
            exit 1
          }
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD^2)" = "$HEAD_SHA" || {
            echo "::error::The merge commit does not contain the authorized pull request head."
            exit 1
          }

      - name: Verify merge-group commit
        if: github.event_name == 'merge_group'
        shell: bash
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$VALIDATION_CANDIDATE_ROOT" rev-parse HEAD)" = "$MERGE_GROUP_SHA" || {
            echo "::error::The checkout does not match the authorized merge-group commit."
            exit 1
          }

      - name: Cleanup processes
        if: runner.os == 'Windows'
        uses: ./.github/actions/cleanup-processes-windows

      - name: Cleanup processes on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/cleanup-processes-linux

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: llamacpp-build-${{ matrix.build_platform }}
          path: ${{ env.VALIDATION_CANDIDATE_ROOT }}/build

      - name: Verify Windows binary artifact
        if: runner.os == 'Windows'
        shell: PowerShell
        run: |
          $lemondExe = Join-Path `
            $env:VALIDATION_CANDIDATE_ROOT "build\Release\lemond.exe"
          if (-not (Test-Path $lemondExe)) {
              Write-Host "ERROR: lemond.exe not found!" -ForegroundColor Red
              Get-ChildItem -Recurse `
                (Join-Path $env:VALIDATION_CANDIDATE_ROOT "build") |
                Select-Object FullName
              exit 1
          }
          if ((Get-Item $lemondExe).Attributes -band `
              [IO.FileAttributes]::ReparsePoint) {
              Write-Host "ERROR: lemond.exe must not be a link!" `
                -ForegroundColor Red
              exit 1
          }
          Write-Host "Binary artifact verified!" -ForegroundColor Green

      - name: Verify Linux or macOS binary artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          lemond="$VALIDATION_CANDIDATE_ROOT/build/lemond"
          test -f "$lemond"
          test ! -L "$lemond"
          chmod +x "$lemond"

      - name: Set up trusted or branch validation environment
        id: validation-venv
        uses: ./.github/actions/setup-venv
        with:
          venv-name: '.venv'
          python-version: '3.10'
          requirements-file: '${{ github.workspace }}/test/requirements.txt'

      - name: Run validation with lemond
        id: run-validation
        env:
          CAPABILITY_MODELS: ${{ join(matrix.capability_models || fromJSON('[]'), ',') }}
          CAPABILITY_PROFILE: ${{ matrix.capability_profile || '' }}
          CANDIDATE_LEMOND: ${{ runner.os == 'Windows' && format('{0}/build/Release/lemond.exe', env.VALIDATION_CANDIDATE_ROOT) || format('{0}/build/lemond', env.VALIDATION_CANDIDATE_ROOT) }}
          HF_TOKEN: ${{ github.event_name == 'schedule' && secrets.HUGGINGFACE_ACCESS_TOKEN || '' }}
          HUGGINGFACE_TOKEN: ''
          HUGGING_FACE_HUB_TOKEN: ''
          LLAMACPP_BACKEND: ${{ matrix.backend }}
          LLAMACPP_CHANNEL: ${{ matrix.channel }}
          LLAMACPP_TEST_MODELS: ${{ join(matrix.models, ',') }}
          LITE_MODE: ${{ matrix.lite }}
          LEMONADE_PROTECTED_RUNNER_CONTEXT: ${{ matrix.target == 'macos-metal' && runner.environment == 'github-hosted' && join(matrix.runner, ',') == 'macos-latest' && 'github-hosted:macos-latest:macos-metal' || '' }}
          PYTHONPATH: ${{ github.workspace }}
          TARGET: "${{ matrix.target }}"
          VALIDATION_ROOT: ${{ github.workspace }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: >-
          python "$VALIDATION_ROOT/.github/scripts/run_llamacpp_validation.py"
          --lemond "$CANDIDATE_LEMOND"
          --python "${{ steps.validation-venv.outputs.python-path }}"
          ${{ github.event_name == 'schedule' && '--allow-huggingface-download-credentials' || '' }}
          ${{ matrix.target == 'macos-metal' && runner.environment == 'github-hosted' && join(matrix.runner, ',') == 'macos-latest' && '--allow-darwin-github-hosted-ephemeral-runner' || '' }}

      - name: Upload results
        if: >-
          steps.run-validation.outcome == 'success' &&
          !((github.event_name == 'pull_request_target' || github.event_name == 'merge_group') &&
          matrix.target == 'macos-metal' && runner.environment == 'github-hosted' &&
          join(matrix.runner, ',') == 'macos-latest')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: validation-results-${{ matrix.target }}
          path: ${{ steps.run-validation.outputs.validation_result }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload restart results
        if: >-
          steps.run-validation.outcome == 'success' &&
          !((github.event_name == 'pull_request_target' || github.event_name == 'merge_group') &&
          matrix.target == 'macos-metal' && runner.environment == 'github-hosted' &&
          join(matrix.runner, ',') == 'macos-latest')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: restart-validation-results-${{ matrix.target }}
          path: ${{ steps.run-validation.outputs.restart_result }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload server logs
        if: >-
          steps.run-validation.outcome == 'success' &&
          !((github.event_name == 'pull_request_target' || github.event_name == 'merge_group') &&
          matrix.target == 'macos-metal' && runner.environment == 'github-hosted' &&
          join(matrix.runner, ',') == 'macos-latest')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-logs-${{ matrix.target }}
          path: |
            ${{ steps.run-validation.outputs.prepare_stdout_log }}
            ${{ steps.run-validation.outputs.prepare_stderr_log }}
            ${{ steps.run-validation.outputs.validation_stdout_log }}
            ${{ steps.run-validation.outputs.validation_stderr_log }}
            ${{ steps.run-validation.outputs.restart_stdout_log }}
            ${{ steps.run-validation.outputs.restart_stderr_log }}
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: >-
          always() && runner.os == 'Windows' &&
          github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        uses: ./.github/actions/cleanup-processes-windows

      - name: Cleanup on Linux
        if: >-
          always() && runner.os == 'Linux' &&
          github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        uses: ./.github/actions/cleanup-processes-linux

  reverify-protected-release-manifest:
    name: Reverify protected release manifest
    needs: [validate, verify-protected-release-manifest]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.verify-protected-release-manifest.result == 'success' ||
      needs.verify-protected-release-manifest.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: No protected manifest recheck is needed
        if: github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
        run: echo "This invocation does not review a protected pin change."
      - name: Check out the protected candidate commit
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check out trusted validation tools
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Reverify managed llama.cpp pins
        if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash trusted/.github/scripts/verify_llamacpp_pin_manifest.sh
          "$GITHUB_WORKSPACE/trusted" "$GITHUB_WORKSPACE/candidate"
          "$BASE_SHA" "$CANDIDATE_SHA"

  # Keep a stable terminal job for callers that require one validation result.
  validation-gate:
    name: llama.cpp validation
    needs: [validate-invocation, build, validate, reverify-protected-release-manifest, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gated jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"

          incomplete=$(jq -r \
            'to_entries[] | select(.value.result != "success") | .key' \
            <<<"$NEEDS" | paste -sd ',' -)
          if [ -n "$incomplete" ]; then
            echo "FAILED OR INCOMPLETE: $incomplete"
            exit 1
          fi
