name: Update llama.cpp Releases

on:
  schedule:
    - cron: "0 16 * * 0"

permissions:
  contents: read

concurrency:
  group: llamacpp-auto-update
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidates
    permissions:
      contents: read
    uses: ./.github/workflows/validate_llamacpp_core.yml
    secrets:
      HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}

  publish:
    name: Publish validated update
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      needs.validate.outputs.promotion_eligible == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: llamacpp-auto-update-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download validation results
        uses: actions/download-artifact@v7
        with:
          pattern: validation-results-*
          merge-multiple: true

      - name: Validate complete validation evidence
        env:
          EXPECTED_VALIDATION_MATRIX: ${{ needs.validate.outputs.validation_matrix }}
        run: >-
          python -m test.utils.llamacpp_validation_evidence
          --directory .
          --expected-matrix-json "$EXPECTED_VALIDATION_MATRIX"

      - name: Update backend_versions.json with verified releases
        shell: bash
        env:
          LLAMACPP_RELEASE: ${{ needs.validate.outputs.llamacpp_release }}
          LLAMACPP_ROCM_RELEASE: ${{ needs.validate.outputs.llamacpp_rocm_release }}
          LLAMACPP_LEMONADE_RELEASE: ${{ needs.validate.outputs.llamacpp_lemonade_release }}
          LLAMACPP_GGML_UPDATE_BACKENDS: ${{ needs.validate.outputs.ggml_update_backends }}
          LLAMACPP_ROCM_UPDATE_BACKENDS: ${{ needs.validate.outputs.rocm_update_backends }}
          LLAMACPP_LEMONADE_UPDATE_BACKENDS: ${{ needs.validate.outputs.lemonade_update_backends }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          RELEASE_RE = re.compile(r"^b[0-9]+$")

          def parse_csv(value):
              return [item.strip() for item in (value or "").split(",") if item.strip()]

          def update(section, release, backends):
              if not backends:
                  return []
              if not RELEASE_RE.match(release):
                  raise SystemExit(f"Invalid llama.cpp release tag: {release}")
              changed = []
              for key in backends:
                  if key not in section:
                      raise SystemExit(f"Refusing to create missing llamacpp.{key}")
                  if not isinstance(section[key], str):
                      raise SystemExit(f"llamacpp.{key} must be a string")
                  old = section[key]
                  section[key] = release
                  changed.append((key, old, release))
              return changed

          path = Path("src/cpp/resources/backend_versions.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          section = data.get("llamacpp")
          if not isinstance(section, dict):
              raise SystemExit("backend_versions.json is missing a llamacpp object")

          changes = []
          changes += update(section, os.environ["LLAMACPP_RELEASE"], parse_csv(os.environ.get("LLAMACPP_GGML_UPDATE_BACKENDS", "")))
          changes += update(section, os.environ["LLAMACPP_ROCM_RELEASE"], parse_csv(os.environ.get("LLAMACPP_ROCM_UPDATE_BACKENDS", "")))
          changes += update(section, os.environ["LLAMACPP_LEMONADE_RELEASE"], parse_csv(os.environ.get("LLAMACPP_LEMONADE_UPDATE_BACKENDS", "")))

          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          print("Updated llamacpp backend versions:")
          if changes:
              for key, old, new in changes:
                  print(f"  llamacpp.{key}: {old} -> {new}")
          else:
              print("  none")
          PY

      - name: Generate PR body
        shell: bash
        env:
          LLAMACPP_RELEASE: ${{ needs.validate.outputs.llamacpp_release }}
          LLAMACPP_ROCM_RELEASE: ${{ needs.validate.outputs.llamacpp_rocm_release }}
          LLAMACPP_LEMONADE_RELEASE: ${{ needs.validate.outputs.llamacpp_lemonade_release }}
          LLAMACPP_GGML_UPDATE_BACKENDS: ${{ needs.validate.outputs.ggml_update_backends }}
          LLAMACPP_ROCM_UPDATE_BACKENDS: ${{ needs.validate.outputs.rocm_update_backends }}
          LLAMACPP_LEMONADE_UPDATE_BACKENDS: ${{ needs.validate.outputs.lemonade_update_backends }}
          VULKAN_AVAILABLE: ${{ needs.validate.outputs.vulkan_available }}
          CPU_AVAILABLE: ${{ needs.validate.outputs.cpu_available }}
          METAL_AVAILABLE: ${{ needs.validate.outputs.metal_available }}
          ROCM_NIGHTLY_AVAILABLE: ${{ needs.validate.outputs.rocm_nightly_available }}
          ROCM_STABLE_AVAILABLE: ${{ needs.validate.outputs.rocm_stable_available }}
          CUDA_AVAILABLE: ${{ needs.validate.outputs.cuda_available }}
          GGML_MISSING_COUNT: ${{ needs.validate.outputs.ggml_missing_count }}
          ROCM_NIGHTLY_MISSING_COUNT: ${{ needs.validate.outputs.rocm_nightly_missing_count }}
          ROCM_STABLE_MISSING_COUNT: ${{ needs.validate.outputs.rocm_stable_missing_count }}
          CUDA_MISSING_COUNT: ${{ needs.validate.outputs.cuda_missing_count }}
          VALIDATION_MATRIX: ${{ needs.validate.outputs.validation_matrix }}
        run: |
          python3 <<'PYEOF'
          import json
          import os

          def parse_csv(value):
              return [item.strip() for item in (value or "").split(",") if item.strip()]

          def yes(name):
              return os.environ.get(name, "false") == "true"

          def pin_action(backend, release, enabled):
              return release if enabled else "unchanged"

          body_lines = []
          llamacpp = os.environ.get("LLAMACPP_RELEASE", "unknown")
          rocm_nightly = os.environ.get("LLAMACPP_ROCM_RELEASE", "unknown")
          lemonade_release = os.environ.get("LLAMACPP_LEMONADE_RELEASE", "unknown")
          ggml_updates = set(parse_csv(os.environ.get("LLAMACPP_GGML_UPDATE_BACKENDS", "")))
          rocm_updates = set(parse_csv(os.environ.get("LLAMACPP_ROCM_UPDATE_BACKENDS", "")))
          lemonade_updates = set(parse_csv(os.environ.get("LLAMACPP_LEMONADE_UPDATE_BACKENDS", "")))

          pin_plan = {
              "vulkan": pin_action("vulkan", llamacpp, "vulkan" in ggml_updates),
              "cpu": pin_action("cpu", llamacpp, "cpu" in ggml_updates),
              "metal": pin_action("metal", llamacpp, "metal" in ggml_updates),
              "rocm-nightly": pin_action("rocm-nightly", rocm_nightly, "rocm-nightly" in rocm_updates),
              "rocm-stable": pin_action("rocm-stable", lemonade_release, "rocm-stable" in lemonade_updates),
              "cuda": pin_action("cuda", lemonade_release, "cuda" in lemonade_updates),
          }

          body_lines.append("## Auto-update llama.cpp backends")
          body_lines.append("")
          body_lines.append("This PR updates only backend pins whose expected release assets were found.")
          body_lines.append("")
          body_lines.append(f"- **ggml-org/llama.cpp candidate**: `{llamacpp}`")
          body_lines.append(f"- **lemonade-sdk/llamacpp-rocm candidate**: `{rocm_nightly}`")
          body_lines.append(f"- **lemonade-sdk/llama.cpp candidate**: `{lemonade_release}`")
          body_lines.append("")
          body_lines.append("| Backend | Pin action | Asset check |")
          body_lines.append("|---|---|---|")
          body_lines.append(f"| `vulkan` | `{pin_plan['vulkan']}` | {'complete' if yes('VULKAN_AVAILABLE') else 'incomplete'} |")
          body_lines.append(f"| `cpu` | `{pin_plan['cpu']}` | {'complete' if yes('CPU_AVAILABLE') else 'incomplete'} |")
          body_lines.append(f"| `metal` | `{pin_plan['metal']}` | {'complete' if yes('METAL_AVAILABLE') else 'incomplete'} |")
          body_lines.append(f"| `rocm-nightly` | `{pin_plan['rocm-nightly']}` | {'complete' if yes('ROCM_NIGHTLY_AVAILABLE') else 'incomplete'} |")
          body_lines.append(f"| `rocm-stable` | `{pin_plan['rocm-stable']}` | {'complete' if yes('ROCM_STABLE_AVAILABLE') else 'incomplete'} |")
          body_lines.append(f"| `cuda` | `{pin_plan['cuda']}` | {'complete' if yes('CUDA_AVAILABLE') else 'incomplete'} |")
          body_lines.append("")
          body_lines.append("Missing asset counts:")
          body_lines.append(f"- ggml-org/llama.cpp: `{os.environ.get('GGML_MISSING_COUNT', 'unknown')}`")
          body_lines.append(f"- lemonade-sdk/llamacpp-rocm rocm-nightly: `{os.environ.get('ROCM_NIGHTLY_MISSING_COUNT', 'unknown')}`")
          body_lines.append(f"- lemonade-sdk/llama.cpp rocm-stable: `{os.environ.get('ROCM_STABLE_MISSING_COUNT', 'unknown')}`")
          body_lines.append(f"- lemonade-sdk/llama.cpp cuda: `{os.environ.get('CUDA_MISSING_COUNT', 'unknown')}`")
          body_lines.append("")
          body_lines.append("## Validation Results")
          body_lines.append("")
          body_lines.append("| Model | Result | Response | input_tokens | output_tokens | time_to_first_token | tokens_per_second |")
          body_lines.append("|-------|--------|----------|--------------|---------------|---------------------|-------------------|")

          validation_matrix = json.loads(os.environ["VALIDATION_MATRIX"])
          for lane in validation_matrix["include"]:
              target = lane["target"]
              results_file = f"llamacpp_validation_{target}.json"
              with open(results_file, "r") as f:
                  results = json.load(f)
              for r in results:
                  status = "PASS" if r["pass"] else "FAIL"
                  # Truncate response for table readability
                  resp = str(r.get("response", ""))[:80].replace("|", "\\|").replace("\n", " ")
                  ttft = r.get("time_to_first_token", "N/A")
                  if isinstance(ttft, float):
                      ttft = f"{ttft:.3f}s"
                  tps = r.get("tokens_per_second", "N/A")
                  if isinstance(tps, float):
                      tps = f"{tps:.1f}"
                  body_lines.append(
                      f"| {r['model']} ({target}) | {status} | {resp} | "
                      f"{r.get('input_tokens', 'N/A')} | {r.get('output_tokens', 'N/A')} | "
                      f"{ttft} | {tps} |"
                  )

          body_lines.append("")
          body_lines.append("---")
          body_lines.append("*Auto-generated by validate_llamacpp workflow*")

          body = "\n".join(body_lines)
          with open("pr_body.md", "w") as f:
              f.write(body)
          PYEOF

      - name: Verify release asset manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ASSET_MANIFEST: ${{ needs.validate.outputs.release_asset_manifest }}
          LLAMACPP_RELEASE: ${{ needs.validate.outputs.llamacpp_release }}
          LLAMACPP_ROCM_RELEASE: ${{ needs.validate.outputs.llamacpp_rocm_release }}
          LLAMACPP_LEMONADE_RELEASE: ${{ needs.validate.outputs.llamacpp_lemonade_release }}
        run: |
          set -euo pipefail

          gh api "repos/ggml-org/llama.cpp/releases/tags/${LLAMACPP_RELEASE}" \
            > publish_ggml_release.json
          gh api "repos/lemonade-sdk/llamacpp-rocm/releases/tags/${LLAMACPP_ROCM_RELEASE}" \
            > publish_rocm_release.json
          gh api "repos/lemonade-sdk/llama.cpp/releases/tags/${LLAMACPP_LEMONADE_RELEASE}" \
            > publish_lemonade_release.json

          attach_source_commit() {
            local repository="$1"
            local tag="$2"
            local path="$3"
            local source_commit
            source_commit=$(gh api "repos/${repository}/commits/${tag}" --jq '.sha')
            if ! [[ "$source_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Could not resolve ${repository} ${tag} to a commit."
              exit 1
            fi
            jq --arg source_commit "$source_commit" \
              '.source_commit = $source_commit' "$path" > "${path}.with-source"
            mv "${path}.with-source" "$path"
          }
          attach_source_commit ggml-org/llama.cpp "$LLAMACPP_RELEASE" publish_ggml_release.json
          attach_source_commit lemonade-sdk/llamacpp-rocm "$LLAMACPP_ROCM_RELEASE" publish_rocm_release.json
          attach_source_commit lemonade-sdk/llama.cpp "$LLAMACPP_LEMONADE_RELEASE" publish_lemonade_release.json

          python -m test.utils.llamacpp_release_manifest \
            --release ggml-org/llama.cpp "$LLAMACPP_RELEASE" publish_ggml_release.json \
            --release lemonade-sdk/llamacpp-rocm "$LLAMACPP_ROCM_RELEASE" publish_rocm_release.json \
            --release lemonade-sdk/llama.cpp "$LLAMACPP_LEMONADE_RELEASE" publish_lemonade_release.json \
            --expected-json "$EXPECTED_RELEASE_ASSET_MANIFEST"

      - name: Publish update pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMACPP_RELEASE: ${{ needs.validate.outputs.llamacpp_release }}
          LLAMACPP_ROCM_RELEASE: ${{ needs.validate.outputs.llamacpp_rocm_release }}
          LLAMACPP_LEMONADE_RELEASE: ${{ needs.validate.outputs.llamacpp_lemonade_release }}
          VALIDATED_BASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/publish_llamacpp_update.sh
