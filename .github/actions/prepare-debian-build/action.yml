name: Prepare Debian Build
description: Resolve the Debian version and create packaging metadata from template

inputs:
  release:
    description: Ubuntu version (e.g., 24.04, 26.04)
    required: true
  codename:
    description: Debian codename (e.g., noble, resolute)
    required: true

outputs:
  version:
    description: Debian version (version without leading 'v')
    value: ${{ steps.get_version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve Debian version
      id: get_version
      shell: bash
      run: |
        DEB_VERSION=$(
          "${GITHUB_ACTION_PATH}/../../scripts/resolve_debian_version.sh" \
            "${{ inputs.release }}"
        )
        echo "version=${DEB_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Create Debian packaging metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -e
        mv contrib/debian .
        sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.version }}~${{ inputs.release }}|g" \
            -e "s|@@DEB_CODENAME@@|${{ inputs.codename }}|g" \
            -e "s|@@DEB_DATE@@|$(date -R)|g" \
            debian/changelog.in > debian/changelog
